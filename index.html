<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fishing Offline</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050b12;
  font-family:Arial,sans-serif;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

#start{
  position:fixed;
  inset:0;
  background:#050b12;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:10;
}

#start h1{
  font-size:70px;
  letter-spacing:8px;
  margin:0 0 15px;
}

#start p{
  opacity:.7;
  letter-spacing:3px;
}

#start button{
  margin-top:30px;
  padding:18px 45px;
  border:0;
  border-radius:12px;
  background:#f0aa35;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

#hud{
  display:none;
  position:fixed;
  top:15px;
  left:15px;
  color:white;
  background:rgba(0,0,0,.65);
  padding:15px;
  border-radius:12px;
  z-index:5;
}

#message{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.75);
  padding:12px 20px;
  border-radius:10px;
  display:none;
  z-index:6;
}
</style>
</head>

<body>

<div id="start">
  <h1>FISHING OFFLINE</h1>
  <p>EXPLORE • FISH • UPGRADE</p>
  <button id="startButton">START GAME</button>
</div>

<canvas id="game"></canvas>

<div id="hud">
  💰 $<span id="money">500</span><br>
  🎒 Fish: <span id="fish">0</span>/2<br>
  💪 Strength: 10<br>
  🌊 Depth: 5m
</div>

<div id="message"></div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   GAME
========================= */

let gameStarted=false;

const player={
  x:0,
  z:-12,
  angle:0,
  speed:0.25
};

const keys={};

document.addEventListener("keydown",function(e){
  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e"){
    interact();
  }
});

document.addEventListener("keyup",function(e){
  keys[e.key.toLowerCase()]=false;
});


/* =========================
   START BUTTON
========================= */

document.getElementById("startButton").addEventListener("click",function(){

  gameStarted=true;

  document.getElementById("start").style.display="none";
  document.getElementById("hud").style.display="block";

  showMessage("Welcome to Fishing Offline! Use WASD to move.");

});


/* =========================
   SHOPS
========================= */

const shops=[

  {
    name:"FISH MARKET",
    x:-25,
    z:-5,
    color:"#b87535"
  },

  {
    name:"ROD SHOP",
    x:25,
    z:-5,
    color:"#3d7895"
  },

  {
    name:"BAIT SHOP",
    x:-23,
    z:-23,
    color:"#4d8548"
  },

  {
    name:"FISH MUSEUM",
    x:23,
    z:-23,
    color:"#8055a3"
  }

];


/* =========================
   DOCK
========================= */

const dock={
  x:0,
  start:2,
  end:35,
  width:8
};


/* =========================
   MOVEMENT
========================= */

function move(){

  if(!gameStarted) return;

  let forward=0;
  let sideways=0;

  if(keys["w"]) forward++;
  if(keys["s"]) forward--;
  if(keys["a"]) sideways--;
  if(keys["d"]) sideways++;

  const length=Math.hypot(forward,sideways);

  if(length===0) return;

  forward/=length;
  sideways/=length;

  const speed=player.speed;

  const dx=
    Math.sin(player.angle)*forward+
    Math.cos(player.angle)*sideways;

  const dz=
    Math.cos(player.angle)*forward-
    Math.sin(player.angle)*sideways;

  player.x+=dx*speed;
  player.z+=dz*speed;

  /* keep player on island */

  player.x=Math.max(-43,Math.min(43,player.x));
  player.z=Math.max(-37,Math.min(30,player.z));

}


/* =========================
   MOUSE LOOK
========================= */

let mouseDown=false;
let lastMouseX=0;

canvas.addEventListener("mousedown",function(e){

  mouseDown=true;
  lastMouseX=e.clientX;

});

window.addEventListener("mouseup",function(){

  mouseDown=false;

});

window.addEventListener("mousemove",function(e){

  if(!mouseDown || !gameStarted) return;

  const difference=e.clientX-lastMouseX;

  player.angle+=difference*0.006;

  lastMouseX=e.clientX;

});


/* =========================
   INTERACTION
========================= */

function interact(){

  for(const shop of shops){

    const distance=Math.hypot(
      player.x-shop.x,
      player.z-shop.z
    );

    if(distance<7){

      showMessage(
        "You are at the "+shop.name+"."
      );

      return;

    }

  }

  if(
    player.x>-5 &&
    player.x<5 &&
    player.z>2 &&
    player.z<35
  ){

    showMessage(
      "Fishing Dock — press SPACE to cast!"
    );

    return;

  }

}


/* =========================
   SPACE FISHING
========================= */

document.addEventListener("keydown",function(e){

  if(e.code==="Space" && gameStarted){

    if(
      player.x>-5 &&
      player.x<5 &&
      player.z>2 &&
      player.z<35
    ){

      showMessage("🎣 You cast your rod!");

    }else{

      showMessage("Walk onto the fishing dock first.");

    }

  }

});


/* =========================
   MESSAGE
========================= */

let messageTimeout;

function showMessage(text){

  const message=document.getElementById("message");

  message.textContent=text;
  message.style.display="block";

  clearTimeout(messageTimeout);

  messageTimeout=setTimeout(function(){

    message.style.display="none";

  },2500);

}


/* =========================
   DRAW SKY
========================= */

function drawSky(){

  const gradient=ctx.createLinearGradient(
    0,0,
    0,canvas.height
  );

  gradient.addColorStop(0,"#4b9fd0");
  gradient.addColorStop(.55,"#a7d9e8");
  gradient.addColorStop(1,"#e6c77c");

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* =========================
   DRAW WATER
========================= */

function drawWater(){

  ctx.fillStyle="#08728c";

  ctx.fillRect(
    0,
    canvas.height*.48,
    canvas.width,
    canvas.height*.52
  );

  for(let y=canvas.height*.5;y<canvas.height;y+=25){

    ctx.strokeStyle="rgba(255,255,255,.15)";
    ctx.lineWidth=2;

    ctx.beginPath();

    for(let x=0;x<canvas.width;x+=30){

      const wave=
        Math.sin(
          x*.03+
          y*.02+
          performance.now()*.001
        )*4;

      if(x===0){

        ctx.moveTo(x,y+wave);

      }else{

        ctx.lineTo(x,y+wave);

      }

    }

    ctx.stroke();

  }

}


/* =========================
   DRAW ISLAND
========================= */

function drawIsland(){

  ctx.fillStyle="#73a653";

  ctx.beginPath();

  ctx.ellipse(
    canvas.width/2,
    canvas.height*.68,
    canvas.width*.48,
    canvas.height*.34,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* beach */

  ctx.strokeStyle="#d8bd72";
  ctx.lineWidth=25;

  ctx.beginPath();

  ctx.ellipse(
    canvas.width/2,
    canvas.height*.68,
    canvas.width*.46,
    canvas.height*.32,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();

}


/* =========================
   WORLD TO SCREEN
========================= */

function worldToScreen(x,z){

  const dx=x-player.x;
  const dz=z-player.z;

  const sin=Math.sin(player.angle);
  const cos=Math.cos(player.angle);

  const forward=dz*cos+dx*sin;
  const side=dx*cos-dz*sin;

  if(forward<1){
    return null;
  }

  const scale=500/forward;

  return {

    x:canvas.width/2+side*scale,

    y:canvas.height*.55-forward*.08

  };

}


/* =========================
   DRAW SHOP
========================= */

function drawShop(shop){

  const p=worldToScreen(
    shop.x,
    shop.z
  );

  if(!p) return;

  const distance=Math.hypot(
    shop.x-player.x,
    shop.z-player.z
  );

  const size=Math.max(
    35,
    300/distance
  );

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y+size*.35,
    size*.7,
    size*.2,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* building */

  ctx.fillStyle=shop.color;

  ctx.fillRect(
    p.x-size/2,
    p.y-size*.45,
    size,
    size*.8
  );


  /* roof */

  ctx.fillStyle="#392b25";

  ctx.beginPath();

  ctx.moveTo(
    p.x-size*.62,
    p.y-size*.45
  );

  ctx.lineTo(
    p.x,
    p.y-size*.8
  );

  ctx.lineTo(
    p.x+size*.62,
    p.y-size*.45
  );

  ctx.closePath();

  ctx.fill();


  /* door */

  ctx.fillStyle="#39271d";

  ctx.fillRect(
    p.x-size*.1,
    p.y-size*.1,
    size*.2,
    size*.45
  );


  /* windows */

  ctx.fillStyle="#bcefff";

  ctx.fillRect(
    p.x-size*.35,
    p.y-size*.25,
    size*.18,
    size*.18
  );

  ctx.fillRect(
    p.x+size*.17,
    p.y-size*.25,
    size*.18,
    size*.18
  );


  /* sign */

  ctx.fillStyle="#e6c16c";

  ctx.fillRect(
    p.x-size*.5,
    p.y-size*.95,
    size,
    size*.22
  );

  ctx.fillStyle="#191512";

  ctx.font=Math.max(9,size*.08)+"px Arial";

  ctx.textAlign="center";

  ctx.fillText(
    shop.name,
    p.x,
    p.y-size*.79
  );

}


/* =========================
   DRAW DOCK
========================= */

function drawDock(){

  const near=worldToScreen(
    dock.x,
    dock.start
  );

  const far=worldToScreen(
    dock.x,
    dock.end
  );

  if(!near || !far) return;

  const width=170;

  ctx.fillStyle="#704528";

  ctx.beginPath();

  ctx.moveTo(
    near.x-width/2,
    near.y
  );

  ctx.lineTo(
    near.x+width/2,
    near.y
  );

  ctx.lineTo(
    far.x+width*.35,
    far.y
  );

  ctx.lineTo(
    far.x-width*.35,
    far.y
  );

  ctx.closePath();

  ctx.fill();


  /* planks */

  for(let z=dock.start;z<dock.end;z+=1.4){

    const a=worldToScreen(
      -dock.width/2,
      z
    );

    const b=worldToScreen(
      dock.width/2,
      z
    );

    if(!a||!b) continue;

    ctx.strokeStyle="#a96d3c";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);

    ctx.stroke();

  }


  /* posts */

  for(let z=dock.start;z<dock.end;z+=4){

    const left=worldToScreen(
      -dock.width/2,
      z
    );

    const right=worldToScreen(
      dock.width/2,
      z
    );

    if(left){

      ctx.fillStyle="#4d2e1d";

      ctx.fillRect(
        left.x-4,
        left.y-35,
        8,
        40
      );

    }

    if(right){

      ctx.fillRect(
        right.x-4,
        right.y-35,
        8,
        40
      );

    }

  }

}


/* =========================
   DRAW TREES
========================= */

function drawTree(x,z){

  const p=worldToScreen(x,z);

  if(!p) return;

  const distance=Math.hypot(
    x-player.x,
    z-player.z
  );

  const size=Math.max(
    15,
    250/distance
  );


  ctx.fillStyle="#573522";

  ctx.fillRect(
    p.x-5,
    p.y-size*.2,
    10,
    size*.6
  );


  ctx.fillStyle="#245d37";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-size*.35,
    size*.4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x-size*.25,
    p.y-size*.2,
    size*.3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x+size*.25,
    p.y-size*.2,
    size*.3,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================
   GAME RENDER
========================= */

function render(){

  drawSky();

  drawWater();

  drawIsland();


  /* trees */

  const treePositions=[

    [-35,-10],
    [-38,8],
    [-32,-25],
    [-15,-28],
    [15,-30],
    [35,-24],
    [38,8],
    [32,18],
    [-20,12],
    [20,10]

  ];

  treePositions.forEach(t=>{
    drawTree(t[0],t[1]);
  });


  /* shops */

  shops.forEach(shop=>{
    drawShop(shop);
  });


  /* dock */

  drawDock();


  /* crosshair */

  if(gameStarted){

    ctx.fillStyle="rgba(255,255,255,.7)";

    ctx.beginPath();

    ctx.arc(
      canvas.width/2,
      canvas.height/2,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

  move();

  render();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
