<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fishing Offline</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07131d;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      #69bfe8 0%,
      #bde8f5 38%,
      #277b91 39%,
      #07526b 100%
    );
}

/* SKY */

#sky{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 76% 18%,rgba(255,255,255,.9) 0 2%,transparent 2.5%),
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.8) 0 2%,transparent 2.5%),
    linear-gradient(#56b9e7,#bfeaf4 55%,#75b8bd);
}

.cloud{
  position:absolute;
  width:180px;
  height:45px;
  background:rgba(255,255,255,.72);
  border-radius:50px;
  filter:blur(1px);
  opacity:.7;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.cloud:before{
  width:70px;
  height:70px;
  left:25px;
  top:-25px;
}

.cloud:after{
  width:90px;
  height:90px;
  right:25px;
  top:-40px;
}

.c1{top:10%;left:8%;animation:cloudMove 38s linear infinite}
.c2{top:18%;left:55%;transform:scale(.7);animation:cloudMove 50s linear infinite reverse}
.c3{top:7%;left:35%;transform:scale(.5);animation:cloudMove 60s linear infinite}

@keyframes cloudMove{
  from{margin-left:-10vw}
  to{margin-left:110vw}
}

/* SUN */

#sun{
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  background:#fff6a8;
  right:11%;
  top:7%;
  box-shadow:0 0 55px rgba(255,235,110,.65);
}

/* WORLD */

#world{
  position:absolute;
  left:50%;
  top:47%;
  width:1200px;
  height:720px;
  transform:translate(-50%,-50%);
  perspective:900px;
  pointer-events:none;
}

#water{
  position:absolute;
  left:-30%;
  top:37%;
  width:160%;
  height:80%;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.05) 0 2px,
      transparent 2px 18px
    ),
    linear-gradient(#278ca2,#064b68);
  transform:rotateX(62deg);
  border-radius:50%;
  box-shadow:0 -15px 30px rgba(255,255,255,.18);
}

#waves{
  position:absolute;
  inset:0;
  opacity:.45;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 35px,
      rgba(255,255,255,.25) 36px 38px,
      transparent 39px 80px
    );
  animation:waves 5s linear infinite;
}

@keyframes waves{
  from{transform:translateX(0)}
  to{transform:translateX(80px)}
}

/* ISLAND */

#island{
  position:absolute;
  width:850px;
  height:470px;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) rotateX(58deg);
  border-radius:48%;
  background:
    radial-gradient(circle at 35% 30%,#71c94b 0 8%,transparent 8.5%),
    radial-gradient(circle at 68% 62%,#5fb844 0 11%,transparent 11.5%),
    linear-gradient(135deg,#4b9e38,#77c94f 45%,#3e8b34);
  border:10px solid #286b3a;
  box-shadow:
    0 35px 0 rgba(0,0,0,.22),
    0 50px 70px rgba(0,0,0,.3);
}

#island:before{
  content:"";
  position:absolute;
  inset:9%;
  border-radius:45%;
  border:2px dashed rgba(255,255,255,.12);
}

/* PATHS */

.path{
  position:absolute;
  background:#c69b5c;
  border-radius:50%;
  opacity:.9;
  box-shadow:inset 0 0 12px rgba(90,55,20,.3);
}

.path.main{
  width:580px;
  height:65px;
  left:130px;
  top:215px;
  transform:rotate(-10deg);
}

.path.side1{
  width:250px;
  height:45px;
  left:350px;
  top:120px;
  transform:rotate(48deg);
}

.path.side2{
  width:260px;
  height:45px;
  left:500px;
  top:275px;
  transform:rotate(48deg);
}

/* TREES */

.tree{
  position:absolute;
  width:65px;
  height:100px;
  transform-style:preserve-3d;
}

.tree .trunk{
  position:absolute;
  bottom:0;
  left:26px;
  width:14px;
  height:52px;
  background:linear-gradient(90deg,#623919,#a66a36,#4f2c17);
  border-radius:8px;
}

.tree .leaf{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 25%,#a5ef67,#3c9c37 70%);
  box-shadow:
    0 7px 0 #276d31,
    inset -8px -8px 15px rgba(0,0,0,.2);
}

.tree .l1{left:-3px;bottom:38px}
.tree .l2{left:18px;bottom:55px;transform:scale(.85)}
.tree .l3{left:-15px;bottom:60px;transform:scale(.65)}

.t1{left:80px;top:80px;transform:scale(1.1)}
.t2{left:205px;top:55px;transform:scale(.8)}
.t3{left:650px;top:80px;transform:scale(1.2)}
.t4{left:735px;top:230px;transform:scale(.8)}
.t5{left:90px;top:300px;transform:scale(.75)}
.t6{left:570px;top:335px;transform:scale(1)}

.rock{
  position:absolute;
  width:65px;
  height:45px;
  border-radius:55% 45% 35% 40%;
  background:linear-gradient(135deg,#9da7a7,#59666b);
  box-shadow:inset -10px -8px 15px rgba(0,0,0,.3);
}

.r1{left:300px;top:80px}
.r2{left:570px;top:125px;transform:scale(.7)}
.r3{left:425px;top:345px;transform:scale(.8)}

/* DOCK */

#dock{
  position:absolute;
  left:45%;
  top:68%;
  width:330px;
  height:105px;
  transform:rotateX(58deg) rotateZ(-4deg);
}

.plank{
  position:absolute;
  width:100%;
  height:26px;
  background:linear-gradient(#9b6a3e,#5e3a23);
  border:2px solid #402716;
  border-radius:5px;
}

.p1{top:0}
.p2{top:28px}
.p3{top:56px}

.pole{
  position:absolute;
  width:13px;
  height:110px;
  background:#4a2c1a;
  bottom:-30px;
}

.po1{left:30px}
.po2{left:290px}

/* BUILDINGS */

.building{
  position:absolute;
  width:125px;
  height:95px;
  border-radius:8px;
  background:linear-gradient(#eee2c5,#c7a77c);
  border:4px solid #5e3b28;
  box-shadow:0 13px 0 rgba(0,0,0,.2);
}

.building:before{
  content:"";
  position:absolute;
  width:140px;
  height:55px;
  left:-11px;
  top:-37px;
  background:#b93f35;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.door{
  position:absolute;
  width:30px;
  height:50px;
  bottom:0;
  left:47px;
  background:#573a27;
}

.window{
  position:absolute;
  width:30px;
  height:25px;
  top:20px;
  background:#75c9dd;
  border:3px solid #49352a;
}

.w1{left:10px}
.w2{right:10px}

.market{left:18%;top:35%}
.rodshop{left:65%;top:29%}
.baitshop{left:49%;top:14%}
.museum{left:36%;top:51%;transform:scale(.8)}

/* LABELS */

.shopLabel{
  position:absolute;
  color:white;
  background:rgba(0,0,0,.7);
  padding:6px 10px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
  transform:translateY(-28px);
}

/* HUD */

#hud{
  position:absolute;
  left:18px;
  top:18px;
  z-index:20;
  min-width:190px;
  background:rgba(5,13,21,.72);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:15px;
  padding:13px 16px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

#hud .title{
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
}

#money{
  margin-top:5px;
  font-size:17px;
  color:#ffe875;
}

#rodInfo{
  margin-top:3px;
  font-size:13px;
  opacity:.85;
}

/* CROSSHAIR */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:25px;
  height:25px;
  transform:translate(-50%,-50%);
  z-index:25;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair:before{
  width:2px;
  height:25px;
  left:11px;
}

#crosshair:after{
  height:2px;
  width:25px;
  top:11px;
}

/* MESSAGE */

#message{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:30;
  background:rgba(0,0,0,.78);
  padding:12px 20px;
  border-radius:12px;
  font-weight:bold;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

#message.show{
  opacity:1;
}

/* CONTROLS */

#controls{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:30;
  display:flex;
  gap:10px;
}

.control{
  min-width:54px;
  height:54px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;
  background:rgba(5,15,25,.78);
  color:white;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.control:active{
  transform:scale(.94);
  background:rgba(255,255,255,.2);
}

/* MOBILE JOYSTICK */

#joystick{
  position:absolute;
  left:22px;
  bottom:22px;
  width:135px;
  height:135px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.2);
  z-index:31;
  display:none;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  left:40px;
  top:40px;
}

/* CAST UI */

#castButton{
  display:none;
}

/* FISHING */

#fishingScreen{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  background:
    linear-gradient(
      rgba(3,46,67,.8),
      rgba(1,20,38,.96)
    );
}

#fishingScreen.active{
  display:block;
}

#underwater{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 5%,rgba(135,235,255,.45),transparent 30%),
    linear-gradient(#0d7891,#022c49 70%,#011a2d);
}

.bubble{
  position:absolute;
  width:8px;
  height:8px;
  border:2px solid rgba(255,255,255,.4);
  border-radius:50%;
  animation:bubble 5s linear infinite;
}

@keyframes bubble{
  from{transform:translateY(100vh);opacity:0}
  20%{opacity:1}
  to{transform:translateY(-100px);opacity:0}
}

#depth{
  position:absolute;
  right:20px;
  top:20px;
  font-size:20px;
  font-weight:bold;
}

#hook{
  position:absolute;
  width:24px;
  height:24px;
  border:4px solid white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px white;
}

#hookLine{
  position:absolute;
  width:2px;
  height:50%;
  background:white;
  left:50%;
  top:0;
  transform-origin:top;
}

.fish{
  position:absolute;
  width:70px;
  height:35px;
  border-radius:60% 40% 40% 60%;
  background:linear-gradient(90deg,#ffb347,#e86835);
  box-shadow:0 0 10px rgba(255,255,255,.2);
}

.fish:after{
  content:"";
  position:absolute;
  left:-20px;
  top:4px;
  border-right:25px solid #e86835;
  border-top:14px solid transparent;
  border-bottom:14px solid transparent;
}

#fishingInfo{
  position:absolute;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  text-align:center;
  background:rgba(0,0,0,.65);
  border-radius:15px;
  padding:14px 25px;
}

#reelBar{
  width:280px;
  height:18px;
  background:#18232c;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

#reelProgress{
  width:0%;
  height:100%;
  background:#72df74;
}

/* MENU */

#startScreen{
  position:absolute;
  inset:0;
  z-index:200;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at center,rgba(20,65,85,.5),transparent 40%),
    #02070c;
}

.startBox{
  width:min(600px,90%);
}

.logo{
  font-size:clamp(55px,10vw,110px);
  font-weight:1000;
  letter-spacing:8px;
  text-shadow:0 8px 30px rgba(0,0,0,.6);
}

.logo span{
  color:#ff7034;
}

.subtitle{
  margin-top:8px;
  font-size:16px;
  letter-spacing:5px;
  opacity:.7;
}

#startButton{
  margin-top:35px;
  padding:18px 55px;
  border:0;
  border-radius:14px;
  background:white;
  color:#07131d;
  font-weight:900;
  font-size:19px;
  cursor:pointer;
  transition:.2s;
}

#startButton:hover{
  transform:scale(1.06);
}

.instructions{
  margin-top:25px;
  line-height:1.8;
  color:#cbd7de;
  font-size:14px;
}

/* SHOP */

#shopPanel{
  position:absolute;
  z-index:150;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(500px,90%);
  background:rgba(5,12,20,.95);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:25px;
  display:none;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

#shopPanel.open{
  display:block;
}

#shopTitle{
  font-size:28px;
  font-weight:900;
}

.shopItem{
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,.07);
}

.shopItem button{
  margin-top:10px;
  padding:10px 15px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.closeShop{
  float:right;
  background:#d84848;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:8px;
}

/* DESKTOP ONLY */

@media (pointer:fine){
  #game{
    cursor:crosshair;
  }
}

/* MOBILE */

@media(max-width:800px){
  #controls{
    right:15px;
    left:auto;
    bottom:18px;
    transform:none;
    flex-wrap:wrap;
    width:180px;
    justify-content:flex-end;
  }

  #joystick{
    display:block;
  }

  #castButton{
    display:block;
  }

  #hud{
    left:10px;
    top:10px;
    min-width:150px;
    padding:9px 12px;
  }

  .logo{
    font-size:55px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="sky">
    <div id="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <div id="world">

    <div id="water">
      <div id="waves"></div>
    </div>

    <div id="island">

      <div class="path main"></div>
      <div class="path side1"></div>
      <div class="path side2"></div>

      <div class="tree t1">
        <div class="trunk"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
      </div>

      <div class="tree t2">
        <div class="trunk"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
      </div>

      <div class="tree t3">
        <div class="trunk"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
      </div>

      <div class="tree t4">
        <div class="trunk"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
      </div>

      <div class="tree t5">
        <div class="trunk"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
      </div>

      <div class="tree t6">
        <div class="trunk"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>
      </div>

      <div class="rock r1"></div>
      <div class="rock r2"></div>
      <div class="rock r3"></div>

      <div class="building market">
        <div class="door"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="shopLabel">FISH MARKET</div>
      </div>

      <div class="building rodshop">
        <div class="door"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="shopLabel">ROD SHOP</div>
      </div>

      <div class="building baitshop">
        <div class="door"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="shopLabel">BAIT SHOP</div>
      </div>

      <div class="building museum">
        <div class="door"></div>
        <div class="window w1"></div>
        <div class="window w2"></div>
        <div class="shopLabel">FISH MUSEUM</div>
      </div>

    </div>

    <div id="dock">
      <div class="plank p1"></div>
      <div class="plank p2"></div>
      <div class="plank p3"></div>
      <div class="pole po1"></div>
      <div class="pole po2"></div>
    </div>

  </div>

  <div id="hud">
    <div class="title">🎣 FISHING OFFLINE</div>
    <div id="money">💰 $0</div>
    <div id="rodInfo">Rod Lv. 1 • Bait Lv. 1</div>
  </div>

  <div id="crosshair"></div>

  <div id="message"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="controls">
    <button class="control" id="jumpButton">JUMP</button>
    <button class="control" id="sprintButton">RUN</button>
    <button class="control" id="castButton">CAST</button>
    <button class="control" id="interactButton">E</button>
  </div>

  <div id="fishingScreen">

    <div id="underwater">

      <div class="bubble" style="left:12%;animation-delay:0s"></div>
      <div class="bubble" style="left:30%;animation-delay:2s"></div>
      <div class="bubble" style="left:55%;animation-delay:1s"></div>
      <div class="bubble" style="left:78%;animation-delay:3s"></div>

      <div class="fish" style="left:25%;top:30%;transform:scale(.8)"></div>
      <div class="fish" style="left:70%;top:48%;transform:scale(1.2)"></div>
      <div class="fish" style="left:40%;top:65%;transform:scale(.6)"></div>

      <div id="hookLine"></div>
      <div id="hook"></div>

      <div id="depth">
        DEPTH: <span id="depthValue">0</span>m
      </div>

      <div id="fishingInfo">
        <div id="fishingText">
          Move the hook with WASD
        </div>

        <div id="reelBar">
          <div id="reelProgress"></div>
        </div>

        <small>
          SPACE / CLICK to reel
        </small>
      </div>

    </div>

  </div>

  <div id="shopPanel">
    <button class="closeShop" id="closeShop">X</button>
    <div id="shopTitle">SHOP</div>
    <div id="shopContent"></div>
  </div>

  <div id="startScreen">

    <div class="startBox">

      <div class="logo">
        FISHING <span>OFFLINE</span>
      </div>

      <div class="subtitle">
        EXPLORE • FISH • UPGRADE
      </div>

      <button id="startButton">
        PLAY
      </button>

      <div class="instructions">
        WASD — Move<br>
        Mouse — Look around<br>
        SPACE — Jump / Reel<br>
        SHIFT — Sprint<br>
        F — Cast<br>
        E — Interact
      </div>

    </div>

  </div>

</div>

<script>
"use strict";

/* =========================
   GAME STATE
========================= */

const game = document.getElementById("game");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const moneyEl = document.getElementById("money");
const rodInfo = document.getElementById("rodInfo");
const messageEl = document.getElementById("message");
const fishingScreen = document.getElementById("fishingScreen");
const depthValue = document.getElementById("depthValue");
const fishingText = document.getElementById("fishingText");
const reelProgress = document.getElementById("reelProgress");
const shopPanel = document.getElementById("shopPanel");
const shopTitle = document.getElementById("shopTitle");
const shopContent = document.getElementById("shopContent");

let state = {
  money: 100,
  rod: 1,
  bait: 1,
  fish: [],
  scrolls: 0
};

let keys = {};
let running = false;
let started = false;

let player = {
  x: 0,
  y: 0,
  z: 0,
  yaw: 0,
  pitch: 0,
  vy: 0,
  speed: 0.11,
  grounded: true
};

let camera = {
  x: 0,
  y: 0,
  z: 0,
  yaw: 0,
  pitch: 0
};

let fishing = false;
let hook = {
  x: 50,
  y: 50,
  depth: 0
};

let reel = 0;
let caughtFish = null;

let mouseLocked = false;
let lastMouseX = 0;
let lastMouseY = 0;

let touchLook = false;
let touchX = 0;
let touchY = 0;

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

let sprinting = false;

const fishTypes = [
  {
    name:"Minnow",
    rarity:"Common",
    value:8,
    chance:45,
    maxDepth:25
  },
  {
    name:"Bluegill",
    rarity:"Common",
    value:15,
    chance:25,
    maxDepth:35
  },
  {
    name:"Golden Trout",
    rarity:"Rare",
    value:50,
    chance:14,
    maxDepth:50
  },
  {
    name:"Crystal Fish",
    rarity:"Epic",
    value:120,
    chance:8,
    maxDepth:70
  },
  {
    name:"Shadow Fish",
    rarity:"Legendary",
    value:300,
    chance:5,
    maxDepth:90
  },
  {
    name:"Mutant Fish",
    rarity:"Mutant",
    value:1000,
    chance:2,
    maxDepth:120
  },
  {
    name:"Ancient Leviathan",
    rarity:"MYTHIC",
    value:5000,
    chance:1,
    maxDepth:150
  }
];

/* =========================
   SAVE
========================= */

function loadGame(){

  try{

    const saved = localStorage.getItem("fishingOfflineSave");

    if(saved){

      const parsed = JSON.parse(saved);

      if(parsed && typeof parsed === "object"){
        state = {
          ...state,
          ...parsed
        };
      }

    }

  }catch(error){

    console.log("Save unavailable");

  }

  updateHUD();
}

function saveGame(){

  try{
    localStorage.setItem(
      "fishingOfflineSave",
      JSON.stringify(state)
    );
  }catch(error){}
}

/* =========================
   HUD
========================= */

function updateHUD(){

  moneyEl.textContent =
    "💰 $" + Math.max(0,Math.floor(state.money));

  rodInfo.textContent =
    "Rod Lv. " + state.rod +
    " • Bait Lv. " + state.bait;

}

/* =========================
   MESSAGE
========================= */

let messageTimer = null;

function message(text){

  messageEl.textContent = text;
  messageEl.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer = setTimeout(()=>{
    messageEl.classList.remove("show");
  },2200);

}

/* =========================
   START
========================= */

startButton.addEventListener("click",()=>{

  started = true;
  startScreen.style.display = "none";

  message("Welcome to Fishing Offline!");

  saveGame();

});

loadGame();

/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",event=>{

  keys[event.code] = true;

  if(
    ["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"]
      .includes(event.code)
  ){
    event.preventDefault();
  }

  if(!started)return;

  if(event.code === "Space"){

    if(fishing){
      reelFish();
    }else{
      jump();
    }

  }

  if(event.code === "KeyF"){

    if(!fishing){
      cast();
    }

  }

  if(event.code === "KeyE"){
    interact();
  }

  if(event.code === "ShiftLeft" || event.code === "ShiftRight"){
    sprinting = true;
  }

});

window.addEventListener("keyup",event=>{

  keys[event.code] = false;

  if(
    event.code === "ShiftLeft" ||
    event.code === "ShiftRight"
  ){
    sprinting = false;
  }

});

/* =========================
   MOUSE LOOK
========================= */

game.addEventListener("click",()=>{

  if(!started)return;

  if(document.pointerLockElement !== game){

    try{
      game.requestPointerLock();
    }catch(error){}

  }

});

document.addEventListener("pointerlockchange",()=>{

  mouseLocked =
    document.pointerLockElement === game;

});

document.addEventListener("mousemove",event=>{

  if(!started || !mouseLocked)return;

  if(fishing)return;

  player.yaw += event.movementX * 0.003;
  player.pitch -= event.movementY * 0.003;

  player.pitch =
    Math.max(
      -1.35,
      Math.min(1.35,player.pitch)
    );

});

/* =========================
   TOUCH LOOK
========================= */

game.addEventListener("pointerdown",event=>{

  if(event.pointerType === "touch"){

    touchLook = true;
    touchX = event.clientX;
    touchY = event.clientY;

  }

});

game.addEventListener("pointermove",event=>{

  if(
    !touchLook ||
    event.pointerType !== "touch" ||
    fishing
  )return;

  const dx = event.clientX - touchX;
  const dy = event.clientY - touchY;

  if(Math.abs(dx) > 2 || Math.abs(dy) > 2){

    player.yaw += dx * 0.006;
    player.pitch -= dy * 0.006;

    player.pitch =
      Math.max(
        -1.35,
        Math.min(1.35,player.pitch)
      );

    touchX = event.clientX;
    touchY = event.clientY;

  }

});

game.addEventListener("pointerup",event=>{

  if(event.pointerType === "touch"){
    touchLook = false;
  }

});

/* =========================
   MOVEMENT
========================= */

function jump(){

  if(!player.grounded)return;

  player.vy = 0.24;
  player.grounded = false;

}

function updateMovement(){

  if(!started || fishing)return;

  let forward = 0;
  let strafe = 0;

  if(keys.KeyW || keys.ArrowUp)forward += 1;
  if(keys.KeyS || keys.ArrowDown)forward -= 1;
  if(keys.KeyD || keys.ArrowRight)strafe += 1;
  if(keys.KeyA || keys.ArrowLeft)strafe -= 1;

  if(joystickActive){

    forward += -joystickY;
    strafe += joystickX;

  }

  const length =
    Math.sqrt(
      forward * forward +
      strafe * strafe
    );

  if(length > 1){

    forward /= length;
    strafe /= length;

  }

  const speed =
    sprinting ? player.speed * 1.75 : player.speed;

  const sin = Math.sin(player.yaw);
  const cos = Math.cos(player.yaw);

  player.x +=
    (forward * sin + strafe * cos) * speed;

  player.z +=
    (forward * cos - strafe * sin) * speed;

  /* Jump physics */

  player.vy -= 0.012;
  player.y += player.vy;

  if(player.y <= 0){

    player.y = 0;
    player.vy = 0;
    player.grounded = true;

  }

  /* Keep player around island */

  const maxDistance = 8;

  player.x =
    Math.max(
      -maxDistance,
      Math.min(maxDistance,player.x)
    );

  player.z =
    Math.max(
      -maxDistance,
      Math.min(maxDistance,player.z)
    );

}

/* =========================
   CAMERA
========================= */

function updateCamera(){

  camera.x = player.x;
  camera.y = player.y;
  camera.z = player.z;
  camera.yaw = player.yaw;
  camera.pitch = player.pitch;

  /*
   This gives the scene a convincing
   first-person movement effect.
  */

  const world = document.getElementById("world");

  const px = player.x * 38;
  const pz = player.z * 38;

  const yawDegrees =
    player.yaw * 57.2958;

  const pitchDegrees =
    player.pitch * 57.2958;

  const jumpOffset =
    -player.y * 160;

  world.style.transform =
    "translate(calc(-50% + " +
    (-px) + "px), calc(-50% + " +
    (jumpOffset + pz) +
    "px)) rotateX(" +
    (58 - pitchDegrees * .25) +
    "deg) rotateZ(" +
    (-yawDegrees * .18) +
    "deg)";

}

/* =========================
   FISHING
========================= */

function cast(){

  if(fishing)return;

  fishing = true;

  fishingScreen.classList.add("active");

  hook.x = 50;
  hook.y = 50;
  hook.depth = 0;

  reel = 0;

  fishingText.textContent =
    "Move the hook around to find fish!";

  message("Cast!");

}

function updateFishing(){

  if(!fishing)return;

  let dx = 0;
  let dy = 0;

  if(keys.KeyA || keys.ArrowLeft)dx -= 0.7;
  if(keys.KeyD || keys.ArrowRight)dx += 0.7;
  if(keys.KeyW || keys.ArrowUp)dy -= 0.7;
  if(keys.KeyS || keys.ArrowDown)dy += 0.7;

  hook.x += dx;
  hook.y += dy;

  hook.x =
    Math.max(5,Math.min(95,hook.x));

  hook.y =
    Math.max(8,Math.min(90,hook.y));

  hook.depth =
    Math.round(
      ((hook.y - 8) / 82) *
      (35 + state.rod * 15)
    );

  depthValue.textContent =
    hook.depth;

  const hookEl =
    document.getElementById("hook");

  const line =
    document.getElementById("hookLine");

  hookEl.style.left =
    hook.x + "%";

  hookEl.style.top =
    hook.y + "%";

  line.style.left =
    "50%";

  line.style.height =
    Math.max(10,hook.y) + "%";

  /* Fish encounter */

  if(Math.random() < 0.006 + state.bait * 0.002){

    const fish =
      chooseFish(hook.depth);

    if(fish){

      caughtFish = fish;

      fishingText.textContent =
        "🐟 " + fish.name +
        " BIT! REEL NOW!";

      reelProgress.style.width =
        reel + "%";

      if(navigator.vibrate){
        navigator.vibrate(80);
      }

    }

  }

}

/* =========================
   CHOOSE FISH
========================= */

function chooseFish(depth){

  const available =
    fishTypes.filter(
      fish => depth <= fish.maxDepth + state.rod * 10
    );

  if(!available.length)return null;

  let total = 0;

  available.forEach(f=>{
    total += f.chance;
  });

  let roll =
    Math.random() * total;

  for(const fish of available){

    roll -= fish.chance;

    if(roll <= 0){

      /* Mutant scroll */

      if(
        Math.random() <
        0.002 + state.bait * 0.0005
      ){
        state.scrolls++;
        message("📜 You found a MUTANT SCROLL!");
      }

      return fish;

    }

  }

  return available[0];

}

/* =========================
   REEL
========================= */

function reelFish(){

  if(!fishing)return;

  if(!caughtFish){

    reel = Math.max(0,reel - 3);

    fishingText.textContent =
      "No fish hooked yet...";

    return;

  }

  reel +=
    8 +
    state.rod * 1.5;

  reelProgress.style.width =
    Math.min(100,reel) + "%";

  if(reel >= 100){

    finishCatch();

  }else{

    fishingText.textContent =
      "REEL! " +
      Math.round(reel) +
      "%";

  }

}

/* =========================
   FINISH CATCH
========================= */

function finishCatch(){

  if(!caughtFish)return;

  const fish = caughtFish;

  state.fish.push({
    name:fish.name,
    rarity:fish.rarity,
    value:fish.value
  });

  state.money += fish.value;

  message(
    "🎣 Caught " +
    fish.name +
    "! +$" +
    fish.value
  );

  fishingText.textContent =
    "Caught " +
    fish.name +
    "!";

  saveGame();
  updateHUD();

  setTimeout(endFishing,1200);

}

/* =========================
   END FISHING
========================= */

function endFishing(){

  fishing = false;
  caughtFish = null;
  reel = 0;

  fishingScreen.classList.remove("active");

}

/* =========================
   SHOPS
========================= */

function interact(){

  if(!started || fishing)return;

  /*
   Approximate shop interaction
   based on player location.
  */

  const x = player.x;
  const z = player.z;

  if(x < -2 && z < 0){

    openShop("Fish Market");

  }else if(x > 2 && z < 0){

    openShop("Rod Shop");

  }else if(x > 0 && z > 2){

    openShop("Bait Shop");

  }else if(x < 0 && z > 2){

    openShop("Fish Museum");

  }else{

    message("Walk closer to a shop!");

  }

}

function openShop(type){

  shopPanel.classList.add("open");
  shopTitle.textContent = type;

  if(type === "Fish Market"){

    const count = state.fish.length;

    shopContent.innerHTML = `
      <div class="shopItem">
        <b>Sell all fish</b>
        <p>You have ${count} fish.</p>
        <button id="sellFish">SELL ALL</button>
      </div>
    `;

    document.getElementById("sellFish")
      .addEventListener("click",()=>{

        let total = 0;

        state.fish.forEach(f=>{
          total += f.value;
        });

        state.money += total;
        state.fish = [];

        saveGame();
        updateHUD();

        message("Sold fish for $" + total);

        openShop("Fish Market");

      });

  }

  if(type === "Rod Shop"){

    const price =
      100 * state.rod;

    shopContent.innerHTML = `
      <div class="shopItem">
        <b>Upgrade Rod</b>
        <p>Level ${state.rod} → ${state.rod + 1}</p>
        <p>Price: $${price}</p>
        <button id="buyRod">UPGRADE</button>
      </div>
    `;

    document.getElementById("buyRod")
      .addEventListener("click",()=>{

        if(state.money < price){

          message("Not enough money!");
          return;

        }

        state.money -= price;
        state.rod++;

        saveGame();
        updateHUD();

        message("Rod upgraded!");

        openShop("Rod Shop");

      });

  }

  if(type === "Bait Shop"){

    const price =
      60 * state.bait;

    shopContent.innerHTML = `
      <div class="shopItem">
        <b>Upgrade Bait</b>
        <p>Level ${state.bait} → ${state.bait + 1}</p>
        <p>Price: $${price}</p>
        <button id="buyBait">UPGRADE</button>
      </div>
    `;

    document.getElementById("buyBait")
      .addEventListener("click",()=>{

        if(state.money < price){

          message("Not enough money!");
          return;

        }

        state.money -= price;
        state.bait++;

        saveGame();
        updateHUD();

        message("Bait upgraded!");

        openShop("Bait Shop");

      });

  }

  if(type === "Fish Museum"){

    const unique =
      [...new Set(
        state.fish.map(f=>f.name)
      )];

    shopContent.innerHTML = `
      <div class="shopItem">
        <b>Fish discovered</b>
        <p>${unique.length} / ${fishTypes.length}</p>
        <br>
        ${
          unique.length
          ? unique.join("<br>")
          : "No fish discovered yet."
        }
      </div>

      <div class="shopItem">
        <b>Mutant Scrolls</b>
        <p>📜 ${state.scrolls}</p>
      </div>
    `;

  }

}

document.getElementById("closeShop")
  .addEventListener("click",()=>{

    shopPanel.classList.remove("open");

  });

/* =========================
   BUTTONS
========================= */

document.getElementById("jumpButton")
  .addEventListener("pointerdown",event=>{

    event.preventDefault();
    jump();

  });

document.getElementById("sprintButton")
  .addEventListener("pointerdown",event=>{

    event.preventDefault();
    sprinting = true;

  });

document.getElementById("sprintButton")
  .addEventListener("pointerup",event=>{

    event.preventDefault();
    sprinting = false;

  });

document.getElementById("castButton")
  .addEventListener("pointerdown",event=>{

    event.preventDefault();

    if(fishing){
      reelFish();
    }else{
      cast();
    }

  });

document.getElementById("interactButton")
  .addEventListener("pointerdown",event=>{

    event.preventDefault();
    interact();

  });

/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

joystick.addEventListener("pointerdown",event=>{

  joystickActive = true;

  joystick.setPointerCapture(event.pointerId);

  updateJoystick(event);

});

joystick.addEventListener("pointermove",event=>{

  if(!joystickActive)return;

  updateJoystick(event);

});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

function updateJoystick(event){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left + rect.width / 2;

  const centerY =
    rect.top + rect.height / 2;

  let x =
    (event.clientX - centerX) /
    (rect.width / 2);

  let y =
    (event.clientY - centerY) /
    (rect.height / 2);

  const length =
    Math.sqrt(x*x+y*y);

  if(length > 1){

    x /= length;
    y /= length;

  }

  joystickX = x;
  joystickY = y;

  stick.style.left =
    (40 + x * 35) + "px";

  stick.style.top =
    (40 + y * 35) + "px";

}

function resetJoystick(){

  joystickActive = false;
  joystickX = 0;
  joystickY = 0;

  stick.style.left = "40px";
  stick.style.top = "40px";

}

/* =========================
   GAME LOOP
========================= */

let lastTime = performance.now();

function gameLoop(now){

  const dt =
    Math.min(40,now-lastTime);

  lastTime = now;

  if(started){

    updateMovement();
    updateCamera();
    updateFishing();

  }

  requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

/* =========================
   AUTOSAVE
========================= */

setInterval(()=>{

  if(started){
    saveGame();
  }

},10000);

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

  updateCamera();

});

/* =========================
   PREVENT CONTEXT MENU
========================= */

game.addEventListener(
  "contextmenu",
  event=>event.preventDefault()
);

</script>
