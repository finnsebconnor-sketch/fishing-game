<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.json">
<title>Fishing Offline</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#06101c;color:white}
canvas{display:block;width:100%;height:100%;background:#07111f}
button{
  border:0;border-radius:12px;padding:12px 18px;
  background:#1b9cff;color:white;font-weight:800;
  cursor:pointer;font-size:15px
}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed}
#game{position:fixed;inset:0}
#hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.stat{
  background:rgba(3,12,24,.78);
  border:1px solid rgba(255,255,255,.15);
  padding:9px 12px;border-radius:12px;
  backdrop-filter:blur(5px)
}
#message{
  position:absolute;left:50%;bottom:18%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.78);
  padding:12px 20px;border-radius:14px;
  font-weight:bold;text-align:center;
  opacity:0;transition:.2s;pointer-events:none;z-index:8
}
#crosshair{
  position:absolute;left:50%;top:50%;
  width:12px;height:12px;
  transform:translate(-50%,-50%);
  z-index:4;pointer-events:none
}
#crosshair:before,#crosshair:after{
  content:"";position:absolute;background:white;box-shadow:0 0 3px #000
}
#crosshair:before{width:12px;height:2px;top:5px}
#crosshair:after{height:12px;width:2px;left:5px}
#interact{
  position:absolute;left:50%;bottom:12%;
  transform:translateX(-50%);
  z-index:7;display:none
}
#interact button{background:#ff9d21;color:#111}
#start{
  position:absolute;inset:0;z-index:30;
  background:linear-gradient(#02060d,#08192b);
  display:flex;align-items:center;justify-content:center;
  text-align:center
}
.startBox{max-width:700px;padding:35px}
.startTitle{
  font-size:clamp(55px,10vw,110px);
  font-weight:1000;letter-spacing:7px;
  margin:0;text-shadow:0 8px 35px #000
}
.startSub{font-size:20px;color:#b9d9ef;margin:10px 0 28px}
#startBtn{font-size:20px;padding:16px 32px;background:#16a6ff}
#help{
  position:absolute;bottom:12px;left:50%;
  transform:translateX(-50%);
  color:#9db2c5;font-size:13px;white-space:nowrap
}
#panel{
  position:absolute;inset:5% 7%;
  background:rgba(4,12,22,.96);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;z-index:20;
  display:none;overflow:auto;padding:24px
}
.panelTop{display:flex;justify-content:space-between;align-items:center;gap:15px}
.panelTop h2{margin:0;font-size:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.card{
  background:#0d1c2d;border:1px solid #233d55;
  border-radius:15px;padding:16px
}
.card h3{margin:0 0 7px}
.card p{margin:6px 0;color:#a9bfd0}
.card button{margin-top:8px;width:100%}
.common{color:#ddd}
.uncommon{color:#63e27d}
.rare{color:#55bfff}
.epic{color:#c084ff}
.legendary{color:#ffd84a}
.mythic{color:#ff5f7a}
#fishUI{
  position:absolute;inset:0;z-index:15;
  display:none;background:
  radial-gradient(circle at 50% 30%,rgba(100,220,255,.28),transparent 35%),
  linear-gradient(#087bb4,#02446f 50%,#012b48);
  overflow:hidden
}
#fishTop{
  position:absolute;top:14px;left:50%;
  transform:translateX(-50%);
  text-align:center;z-index:3
}
#depthText{font-size:18px;font-weight:bold}
#fishCanvas{position:absolute;inset:0;width:100%;height:100%}
#fishControls{
  position:absolute;bottom:20px;left:50%;
  transform:translateX(-50%);z-index:5;
  display:flex;gap:10px
}
#catchText{
  position:absolute;top:18%;left:50%;
  transform:translateX(-50%);
  font-size:22px;font-weight:900;
  text-shadow:0 2px 5px #000;z-index:4
}
#joystick{
  position:absolute;left:20px;bottom:25px;
  width:125px;height:125px;border-radius:50%;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.2);
  display:none;z-index:10;touch-action:none
}
#stick{
  position:absolute;left:37px;top:37px;
  width:51px;height:51px;border-radius:50%;
  background:rgba(255,255,255,.45)
}
#mobileLook{
  position:absolute;right:0;top:0;width:55%;height:100%;
  display:none;z-index:2;touch-action:none
}
@media(max-width:800px){
  #joystick,#mobileLook{display:block}
  #help{display:none}
  .stat{font-size:12px;padding:7px 9px}
  #panel{inset:3% 3%;padding:16px}
}
</style>
</head>

<body>
<div id="game">
<canvas id="canvas"></canvas>

<div id="start">
  <div class="startBox">
    <h1 class="startTitle">FISHING OFFLINE</h1>
    <div class="startSub">EXPLORE • FISH • UPGRADE • DISCOVER</div>
    <button id="startBtn">START FISHING</button>
    <p style="color:#71899c;margin-top:20px">
      Designed to work offline after installation.
    </p>
  </div>
</div>

<div id="hud">
  <div class="stat">💰 $<span id="money">0</span></div>
  <div class="stat">🎒 <span id="capacity">0/0</span></div>
  <div class="stat">💪 <span id="strength">0</span></div>
  <div class="stat">📏 <span id="depth">0</span>m</div>
  <div class="stat">🪱 <span id="bait">Basic</span></div>
</div>

<div id="crosshair"></div>
<div id="message"></div>

<div id="interact">
  <button id="interactBtn">INTERACT</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<div id="mobileLook"></div>

<div id="panel">
  <div class="panelTop">
    <h2 id="panelTitle">Shop</h2>
    <button id="closePanel">CLOSE</button>
  </div>
  <div id="panelContent"></div>
</div>

<div id="fishUI">
  <div id="fishTop">
    <div style="font-size:26px;font-weight:900">🎣 FISHING</div>
    <div id="depthText">Depth: 0m</div>
  </div>

  <canvas id="fishCanvas"></canvas>

  <div id="catchText"></div>

  <div id="fishControls">
    <button id="reelBtn">REEL IN</button>
    <button id="finishBtn">FINISH</button>
  </div>
</div>

<div id="help">
  WASD = move • Mouse = look • E = interact • Space = cast
</div>
</div>

<script>
/* =========================================================
   FISHING OFFLINE
   Complete single-file game
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const fishCanvas=document.getElementById("fishCanvas");
const fctx=fishCanvas.getContext("2d");

let W=innerWidth,H=innerHeight;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
  fishCanvas.width=innerWidth;
  fishCanvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

/* ---------------- SAVE ---------------- */

const SAVE_KEY="fishingOfflineBigSave";

let save={
  money:500,
  capacity:2,
  strength:10,
  depth:5,
  baitLuck:0,
  baitName:"Basic",
  fish:{},
  scrolls:{},
  unlocked:["home"]
};

function loadSave(){
  try{
    const x=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(x) save={...save,...x};
  }catch(e){}
}
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(save));
  }catch(e){}
}
loadSave();

/* ---------------- FISH ---------------- */

const fish=[
 {name:"Minnow",rarity:"Common",value:8,depth:1,strength:3,size:7},
 {name:"Bluegill",rarity:"Common",value:15,depth:2,strength:7,size:9},
 {name:"Bass",rarity:"Uncommon",value:30,depth:4,strength:14,size:13},
 {name:"Trout",rarity:"Uncommon",value:45,depth:6,strength:18,size:12},
 {name:"Salmon",rarity:"Rare",value:90,depth:9,strength:27,size:18},
 {name:"Golden Carp",rarity:"Rare",value:150,depth:12,strength:35,size:20},
 {name:"Swordfish",rarity:"Epic",value:300,depth:15,strength:48,size:25},
 {name:"Crystal Fish",rarity:"Epic",value:500,depth:18,strength:60,size:22},
 {name:"Ancient Koi",rarity:"Legendary",value:1200,depth:23,strength:78,size:30},
 {name:"Sea Dragon",rarity:"Mythic",value:3500,depth:30,strength:100,size:36},
 {name:"Void Eel",rarity:"Mythic",value:6000,depth:38,strength:125,size:31},
 {name:"Titan Tuna",rarity:"Legendary",value:9000,depth:45,strength:150,size:42}
];

const scrollList=[
 "Shadow Scroll",
 "Golden Scroll",
 "Crystal Scroll",
 "Void Scroll",
 "Ancient Scroll"
];

const baits=[
 {name:"Basic",cost:0,luck:0},
 {name:"Shiny Bait",cost:150,luck:.12},
 {name:"Golden Bait",cost:500,luck:.3},
 {name:"Mutant Bait",cost:1500,luck:.6}
];

function updateHUD(){
 document.getElementById("money").textContent=Math.floor(save.money);
 document.getElementById("capacity").textContent=
   `${inventory.length}/${save.capacity}`;
 document.getElementById("strength").textContent=save.strength;
 document.getElementById("depth").textContent=save.depth;
 document.getElementById("bait").textContent=save.baitName;
}
updateHUD();

/* ---------------- PLAYER ---------------- */

const player={
 x:0,
 z:8,
 yaw:0,
 pitch:0,
 speed:5
};

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key===" "){
   e.preventDefault();
   if(gameStarted && !panelOpen && !fishing) castStart();
 }

 if(e.key.toLowerCase()==="e"){
   if(gameStarted&&!panelOpen&&!fishing) interact();
 }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* Mouse look */

canvas.addEventListener("click",()=>{
 if(gameStarted && !fishing && !panelOpen){
   canvas.requestPointerLock?.();
 }
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===canvas&&!fishing){
   player.yaw+=e.movementX*.0025;
   player.pitch-=e.movementY*.002;
   player.pitch=Math.max(-.65,Math.min(.65,player.pitch));
 }
});

/* Touch look */

let lookTouch=null;
const mobileLook=document.getElementById("mobileLook");

mobileLook.addEventListener("touchstart",e=>{
 const t=e.changedTouches[0];
 lookTouch={x:t.clientX,y:t.clientY};
},{passive:true});

mobileLook.addEventListener("touchmove",e=>{
 if(!lookTouch)return;
 const t=e.changedTouches[0];
 player.yaw+=(t.clientX-lookTouch.x)*.008;
 player.pitch-=(t.clientY-lookTouch.y)*.006;
 player.pitch=Math.max(-.65,Math.min(.65,player.pitch));
 lookTouch={x:t.clientX,y:t.clientY};
},{passive:true});

mobileLook.addEventListener("touchend",()=>lookTouch=null);

/* ---------------- JOYSTICK ---------------- */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joy={x:0,y:0};

function updateJoy(touch){
 const r=joystick.getBoundingClientRect();
 let x=touch.clientX-(r.left+r.width/2);
 let y=touch.clientY-(r.top+r.height/2);
 const max=42;
 const d=Math.hypot(x,y);
 if(d>max){
   x=x/d*max;
   y=y/d*max;
 }
 joy.x=x/max;
 joy.y=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}

joystick.addEventListener("touchstart",e=>{
 updateJoy(e.changedTouches[0]);
},{passive:true});

joystick.addEventListener("touchmove",e=>{
 updateJoy(e.changedTouches[0]);
},{passive:true});

joystick.addEventListener("touchend",()=>{
 joy.x=joy.y=0;
 stick.style.transform="translate(0,0)";
},{passive:true});

/* ---------------- WORLD ---------------- */

const world={
 minX:-38,
 maxX:38,
 minZ:-32,
 maxZ:45
};

const shops=[
 {name:"SELL SHOP",x:-18,z:3,type:"sell",color:"#24b36b"},
 {name:"ROD SHOP",x:19,z:5,type:"rod",color:"#3f83ff"},
 {name:"BAIT SHOP",x:-17,z:-12,type:"bait",color:"#ff9d24"},
 {name:"FISH MUSEUM",x:18,z:-13,type:"museum",color:"#b45cff"},
 {name:"DEEP SEA",x:0,z:36,type:"deep",color:"#17c7ff"}
];

const trees=[];
const rocks=[];

for(let i=0;i<65;i++){
 trees.push({
   x:-34+Math.random()*68,
   z:-27+Math.random()*66,
   s:.7+Math.random()*1.4
 });
}

for(let i=0;i<80;i++){
 rocks.push({
   x:-37+Math.random()*74,
   z:-30+Math.random()*74,
   s:.3+Math.random()*1.1
 });
}

/* Avoid too many objects at spawn/shop areas */
function nearShop(x,z){
 return shops.some(s=>Math.hypot(x-s.x,z-s.z)<6);
}

/* ---------------- PROJECTION ---------------- */

function project(x,y,z){
 const dx=x-player.x;
 const dz=z-player.z;

 const sin=Math.sin(player.yaw);
 const cos=Math.cos(player.yaw);

 const cx=dx*cos-dz*sin;
 const cz=dx*sin+dz*cos;

 const horizon=H*.48+player.pitch*H*.35;

 if(cz<=.1)return null;

 const f=700/(cz+1);

 return {
   x:W/2+cx*f,
   y:horizon-y*f,
   scale:f
 };
}

/* ---------------- DRAW SKY ---------------- */

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H*.65);
 g.addColorStop(0,"#07172d");
 g.addColorStop(.45,"#1884bd");
 g.addColorStop(1,"#8bd6ef");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 const sun=ctx.createRadialGradient(W*.78,H*.18,10,W*.78,H*.18,170);
 sun.addColorStop(0,"rgba(255,244,177,.8)");
 sun.addColorStop(1,"rgba(255,244,177,0)");
 ctx.fillStyle=sun;
 ctx.fillRect(0,0,W,H*.55);

 /* clouds */
 for(let i=0;i<7;i++){
   const x=((i*310+performance.now()*.005)% (W+300))-150;
   const y=70+(i%3)*55;
   ctx.fillStyle="rgba(255,255,255,.6)";
   ctx.beginPath();
   ctx.arc(x,y,28,0,Math.PI*2);
   ctx.arc(x+30,y-10,38,0,Math.PI*2);
   ctx.arc(x+65,y,28,0,Math.PI*2);
   ctx.fill();
 }
}

/* ---------------- DRAW GROUND ---------------- */

function drawGround(){
 const horizon=H*.48+player.pitch*H*.35;

 ctx.fillStyle="#d8c27a";
 ctx.fillRect(0,horizon,W,H-horizon);

 /* grass */
 for(let i=0;i<18;i++){
   const x=(i/18)*W;
   ctx.fillStyle=i%2?"#75a957":"#6b9d4e";
   ctx.fillRect(x,horizon+10,W/18+2,H-horizon);
 }

 /* ocean */
 const water=project(0,0,35);
 if(water){
   const wy=water.y;
   ctx.fillStyle="#087ba8";
   ctx.fillRect(0,wy,W,H-wy);
   for(let i=0;i<14;i++){
     ctx.strokeStyle=`rgba(255,255,255,${.07+(i%3)*.02})`;
     ctx.beginPath();
     for(let x=0;x<W;x+=20){
       const yy=wy+i*35+Math.sin(x*.025+i)*5;
       if(x===0)ctx.moveTo(x,yy);
       else ctx.lineTo(x,yy);
     }
     ctx.stroke();
   }
 }
}

/* ---------------- WORLD OBJECTS ---------------- */

function drawTree(t){
 const p=project(t.x,0,t.z);
 if(!p)return;
 if(p.x<-100||p.x>W+100)return;

 const s=p.scale*t.s;
 if(s<2)return;

 ctx.fillStyle="#654126";
 ctx.fillRect(p.x-s*.13,p.y-s*1.5,s*.26,s*1.5);

 ctx.fillStyle="#174f2c";
 ctx.beginPath();
 ctx.arc(p.x,p.y-s*1.9,s*.75,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#28753a";
 ctx.beginPath();
 ctx.arc(p.x-s*.35,p.y-s*2.15,s*.48,0,Math.PI*2);
 ctx.arc(p.x+s*.35,p.y-s*2.1,s*.48,0,Math.PI*2);
 ctx.fill();
}

function drawRock(r){
 const p=project(r.x,0,r.z);
 if(!p)return;
 const s=p.scale*r.s;
 if(s<2)return;

 ctx.fillStyle="#65727a";
 ctx.beginPath();
 ctx.ellipse(p.x,p.y,s,s*.55,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="rgba(255,255,255,.18)";
 ctx.beginPath();
 ctx.ellipse(p.x-s*.25,p.y-s*.2,s*.35,s*.13,-.3,0,Math.PI*2);
 ctx.fill();
}

function drawShop(s){
 const p=project(s.x,0,s.z);
 if(!p)return;

 const sc=p.scale;
 const w=5.5*sc;
 const h=4.5*sc;

 if(sc<2)return;

 /* building */
 ctx.fillStyle="#d9e4e8";
 ctx.fillRect(p.x-w/2,p.y-h,w,h);

 /* roof */
 ctx.fillStyle=s.color;
 ctx.beginPath();
 ctx.moveTo(p.x-w*.62,p.y-h);
 ctx.lineTo(p.x,p.y-h-2.2*sc);
 ctx.lineTo(p.x+w*.62,p.y-h);
 ctx.closePath();
 ctx.fill();

 /* door */
 ctx.fillStyle="#27313a";
 ctx.fillRect(p.x-w*.12,p.y-h*.55,w*.24,h*.55);

 /* windows */
 ctx.fillStyle="#9ce8ff";
 ctx.fillRect(p.x-w*.36,p.y-h*.68,w*.2,h*.2);
 ctx.fillRect(p.x+w*.16,p.y-h*.68,w*.2,h*.2);

 /* sign */
 ctx.fillStyle="#07111f";
 ctx.fillRect(p.x-w*.65,p.y-h-3.3*sc,w*1.3,1.1*sc);
 ctx.fillStyle="white";
 ctx.textAlign="center";
 ctx.font=`bold ${Math.max(10,9*sc)}px Arial`;
 ctx.fillText(s.name,p.x,p.y-h-2.55*sc);

 /* distance marker */
 const d=Math.hypot(player.x-s.x,player.z-s.z);
 if(d<8){
   ctx.fillStyle="rgba(0,0,0,.7)";
   ctx.fillRect(p.x-45,p.y+10,90,22);
   ctx.fillStyle="white";
   ctx.font="bold 12px Arial";
   ctx.fillText("E TO USE",p.x,p.y+25);
 }
}

function drawDock(){
 for(let i=0;i<13;i++){
   const z=13+i*2.2;
   const p=project(0,.2,z);
   if(!p)continue;

   const s=p.scale;
   ctx.fillStyle="#7a4b2a";
   ctx.fillRect(p.x-2.5*s,p.y-0.4*s,5*s,.8*s);

   ctx.fillStyle="#4b2e1c";
   ctx.fillRect(p.x-3*s,p.y,0.35*s,2*s);
   ctx.fillRect(p.x+2.65*s,p.y,0.35*s,2*s);
 }
}

/* ---------------- FISHING ROD ---------------- */

function drawRod(){
 if(fishing)return;

 ctx.save();
 ctx.translate(W*.82,H*.78);
 ctx.rotate(-.15);

 ctx.strokeStyle="#6d3e1c";
 ctx.lineWidth=10;
 ctx.beginPath();
 ctx.moveTo(0,100);
 ctx.lineTo(170,-120);
 ctx.stroke();

 ctx.strokeStyle="#d8d8d8";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(100,-30);
 ctx.lineTo(260,-190);
 ctx.stroke();

 ctx.fillStyle="#222";
 ctx.fillRect(-20,70,60,22);

 ctx.restore();
}

/* ---------------- WORLD LOOP ---------------- */

function updateMovement(dt){
 if(fishing||panelOpen)return;

 let forward=0;
 let side=0;

 if(keys.w)forward+=1;
 if(keys.s)forward-=1;
 if(keys.a)side-=1;
 if(keys.d)side+=1;

 forward+=-joy.y;
 side+=joy.x;

 const len=Math.hypot(forward,side);
 if(len>1){
   forward/=len;
   side/=len;
 }

 const sp=player.speed*dt;

 player.x+=(
   Math.sin(player.yaw)*forward+
   Math.cos(player.yaw)*side
 )*sp;

 player.z+=(
   Math.cos(player.yaw)*forward-
   Math.sin(player.yaw)*side
 )*sp;

 player.x=Math.max(world.minX,Math.min(world.maxX,player.x));
 player.z=Math.max(world.minZ,Math.min(world.maxZ,player.z));
}

/* ---------------- INTERACTION ---------------- */

let panelOpen=false;
let activeShop=null;

function nearestShop(){
 let best=null;
 let dist=999;

 for(const s of shops){
   const d=Math.hypot(player.x-s.x,player.z-s.z);
   if(d<dist){
     dist=d;
     best=s;
   }
 }

 return dist<5?best:null;
}

function updateInteraction(){
 if(fishing||panelOpen)return;

 const s=nearestShop();
 const btn=document.getElementById("interact");

 if(s){
   btn.style.display="block";
   document.getElementById("interactBtn").textContent=
     `${s.name} — USE`;
   activeShop=s;
 }else{
   btn.style.display="none";
   activeShop=null;
 }
}

document.getElementById("interactBtn").onclick=()=>interact();

function interact(){
 const s=nearestShop();

 if(!s)return;

 if(s.type==="sell")openSell();
 if(s.type==="rod")openRod();
 if(s.type==="bait")openBait();
 if(s.type==="museum")openMuseum();
 if(s.type==="deep"){
   showMessage("The deep sea is coming soon — upgrade your rod to prepare!");
 }
}

document.getElementById("closePanel").onclick=()=>{
 panelOpen=false;
 document.getElementById("panel").style.display="none";
};

function openPanel(title,html){
 panelOpen=true;
 document.getElementById("panelTitle").textContent=title;
 document.getElementById("panelContent").innerHTML=html;
 document.getElementById("panel").style.display="block";
}

/* ---------------- SELL ---------------- */

function openSell(){
 let total=0;
 inventory.forEach(f=>total+=f.value);

 openPanel("💰 SELL SHOP",`
   <div class="card">
     <h3>Fish ready to sell</h3>
     <p>${inventory.length} fish</p>
     <p style="font-size:25px;color:#6ff0a0">$${total}</p>
     <button id="sellAll" ${total<=0?"disabled":""}>SELL EVERYTHING</button>
   </div>
 `);

 document.getElementById("sellAll").onclick=()=>{
   save.money+=total;
   inventory=[];
   saveGame();
   updateHUD();
   openSell();
   showMessage(`Sold your fish for $${total}!`);
 };
}

/* ---------------- ROD SHOP ---------------- */

function openRod(){
 const capCost=700+save.capacity*650;
 const strCost=450+save.strength*30;
 const depCost=800+save.depth*90;

 openPanel("🔧 ROD UPGRADE SHOP",`
 <div class="cards">

 <div class="card">
  <h3>🎒 Bigger Bag</h3>
  <p>Capacity: ${save.capacity}</p>
  <p>Cost: $${capCost}</p>
  <button id="buyCap">UPGRADE</button>
 </div>

 <div class="card">
  <h3>💪 Stronger Rod</h3>
  <p>Strength: ${save.strength}</p>
  <p>Cost: $${strCost}</p>
  <button id="buyStr">UPGRADE</button>
 </div>

 <div class="card">
  <h3>📏 Deeper Rod</h3>
  <p>Depth: ${save.depth}m</p>
  <p>Cost: $${depCost}</p>
  <button id="buyDepth">UPGRADE</button>
 </div>

 </div>
 `);

 document.getElementById("buyCap").onclick=()=>{
   if(save.money<capCost)return showMessage("Not enough money!");
   save.money-=capCost;
   save.capacity++;
   saveGame();updateHUD();openRod();
 };

 document.getElementById("buyStr").onclick=()=>{
   if(save.money<strCost)return showMessage("Not enough money!");
   save.money-=strCost;
   save.strength+=10;
   saveGame();updateHUD();openRod();
 };

 document.getElementById("buyDepth").onclick=()=>{
   if(save.money<depCost)return showMessage("Not enough money!");
   save.money-=depCost;
   save.depth+=5;
   saveGame();updateHUD();openRod();
 };
}

/* ---------------- BAIT SHOP ---------------- */

function openBait(){
 let html=`<div class="cards">`;

 for(const b of baits){
   html+=`
    <div class="card">
      <h3>🪱 ${b.name}</h3>
      <p>Rare chance: +${Math.round(b.luck*100)}%</p>
      <p>${b.cost===0?"FREE":"$"+b.cost}</p>
      <button data-bait="${b.name}">
        ${save.baitName===b.name?"EQUIPPED":"BUY / EQUIP"}
      </button>
    </div>
   `;
 }

 html+=`</div>`;
 openPanel("🪱 BAIT SHOP",html);

 document.querySelectorAll("[data-bait]").forEach(btn=>{
   btn.onclick=()=>{
     const b=baits.find(x=>x.name===btn.dataset.bait);
     if(!b)return;

     if(b.cost>0){
       if(save.money<b.cost)return showMessage("Not enough money!");
       save.money-=b.cost;
     }

     save.baitName=b.name;
     save.baitLuck=b.luck;
     saveGame();
     updateHUD();
     openBait();
   };
 });
}

/* ---------------- MUSEUM ---------------- */

function openMuseum(){
 let html=`
 <div class="card">
 <h3>🐟 Fish Collection</h3>
 <p>Catch every species to complete the collection.</p>
 </div>
 <div class="cards">
 `;

 for(const f of fish){
   const count=save.fish[f.name]||0;
   html+=`
    <div class="card">
      <h3 class="${f.rarity.toLowerCase()}">${f.name}</h3>
      <p>${f.rarity}</p>
      <p>Depth: ${f.depth}m</p>
      <p>Value: $${f.value}</p>
      <p>Caught: ${count}</p>
    </div>
   `;
 }

 html+=`</div>
 <div class="card" style="margin-top:20px">
 <h3>📜 Mutant Scrolls</h3>
 `;

 for(const s of scrollList){
   html+=`<p>${save.scrolls[s]?"✅":"⬛"} ${s}</p>`;
 }

 html+=`</div>`;

 openPanel("📖 FISH MUSEUM",html);
}

/* ---------------- MESSAGE ---------------- */

let msgTimer;

function showMessage(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.opacity=1;
 clearTimeout(msgTimer);
 msgTimer=setTimeout(()=>el.style.opacity=0,2500);
}

/* ---------------- INVENTORY ---------------- */

let inventory=[];

/* ---------------- CASTING ---------------- */

let castPower=0;
let charging=false;
let fishing=false;

function nearDock(){
 return Math.hypot(player.x,player.z-25)<6;
}

function castStart(){
 if(!nearDock()){
   showMessage("Walk onto the fishing dock first!");
   return;
 }

 if(inventory.length>=save.capacity){
   showMessage("Your fish bag is full! Sell your fish.");
   return;
 }

 if(fishing)return;

 charging=true;
 castPower=0;

 showMessage("Charging cast... press SPACE again to cast!");

 const timer=setInterval(()=>{
   if(!charging){
     clearInterval(timer);
     return;
   }

   castPower+=3;

   if(castPower>=100){
     castPower=100;
     charging=false;
     clearInterval(timer);
     startFishing();
   }
 },30);

 const stop=()=>{
   if(!charging)return;
   charging=false;
   clearInterval(timer);
   startFishing();
 };

 const listener=e=>{
   if(e.code==="Space"){
     e.preventDefault();
     stop();
     removeEventListener("keydown",listener);
   }
 };

 addEventListener("keydown",listener,{once:false});
}

/* ---------------- FISHING ---------------- */

let underwaterFish=[];
let hook={x:innerWidth/2,y:innerHeight*.3};
let fishingTime=0;

function startFishing(){
 fishing=true;
 document.exitPointerLock?.();

 document.getElementById("fishUI").style.display="block";

 hook.x=W/2+(Math.random()-.5)*castPower*4;
 hook.y=H*.18;

 underwaterFish=[];

 const available=fish.filter(f=>f.depth<=save.depth);

 for(let i=0;i<35;i++){
   const base=available[Math.floor(Math.random()*available.length)];
   underwaterFish.push({
     fish:base,
     x:Math.random()*W,
     y:H*.2+Math.random()*H*.65,
     vx:(Math.random()-.5)*1.8,
     phase:Math.random()*Math.PI*2,
     caught:false
   });
 }

 fishingTime=35;
 document.getElementById("catchText").textContent=
   "DRAG THE HOOK THROUGH THE FISH!";

 requestAnimationFrame(fishingLoop);
}

function fishingLoop(){
 if(!fishing)return;

 fctx.clearRect(0,0,W,H);

 /* bubbles */
 for(let i=0;i<35;i++){
   const x=(i*97+performance.now()*.02)%W;
   const y=H-((i*53+performance.now()*.035)%(H*.8));
   fctx.fillStyle="rgba(255,255,255,.15)";
   fctx.beginPath();
   fctx.arc(x,y,3+(i%4),0,Math.PI*2);
   fctx.fill();
 }

 for(const item of underwaterFish){
   if(item.caught)continue;

   item.x+=item.vx;
   item.y+=Math.sin(performance.now()*.002+item.phase)*.35;

   if(item.x<-80)item.x=W+80;
   if(item.x>W+80)item.x=-80;

   drawFish(item);

   const distance=Math.hypot(item.x-hook.x,item.y-hook.y);

   if(distance<35){
     attemptCatch(item);
   }
 }

 /* line */
 fctx.strokeStyle="rgba(245,245,245,.8)";
 fctx.lineWidth=2;
 fctx.beginPath();
 fctx.moveTo(W*.82,H);
 fctx.lineTo(hook.x,hook.y);
 fctx.stroke();

 /* hook */
 fctx.strokeStyle="#ddd";
 fctx.lineWidth=3;
 fctx.beginPath();
 fctx.arc(hook.x,hook.y,9,0,Math.PI);
 fctx.stroke();

 fishingTime-=1/60;

 const depth=Math.max(
   1,
   Math.round(
     ((hook.y-H*.15)/(H*.7))*save.depth
   )
 );

 document.getElementById("depthText").textContent=
   `Depth: ${depth}m • Fish: ${inventory.length}/${save.capacity} • ${Math.ceil(fishingTime)}s`;

 if(fishingTime<=0||inventory.length>=save.capacity){
   finishFishing();
   return;
 }

 requestAnimationFrame(fishingLoop);
}

function drawFish(item){
 const f=item.fish;
 const r=f.rarity.toLowerCase();

 const colors={
   common:"#dce8ef",
   uncommon:"#58df7c",
   rare:"#4dbdff",
   epic:"#c078ff",
   legendary:"#ffd44d",
   mythic:"#ff5275"
 };

 fctx.save();
 fctx.translate(item.x,item.y);

 const flip=item.vx<0?-1:1;
 fctx.scale(flip,1);

 const s=Math.max(7,f.size*.8);

 fctx.fillStyle=colors[r]||"#fff";
 fctx.beginPath();
 fctx.ellipse(0,0,s*1.7,s,0,0,Math.PI*2);
 fctx.fill();

 fctx.beginPath();
 fctx.moveTo(-s*1.5,0);
 fctx.lineTo(-s*2.6,-s);
 fctx.lineTo(-s*2.6,s);
 fctx.closePath();
 fctx.fill();

 fctx.fillStyle="#07111f";
 fctx.beginPath();
 fctx.arc(s*.9,-s*.25,2.5,0,Math.PI*2);
 fctx.fill();

 fctx.restore();
}

function attemptCatch(item){
 if(item.caught)return;

 const f=item.fish;

 if(f.strength>save.strength){
   item.caught=true;
   showFishCatch(`Too strong! ${f.name} needs ${f.strength} strength.`);
   return;
 }

 item.caught=true;
 inventory.push(f);
 save.fish[f.name]=(save.fish[f.name]||0)+1;

 /* scroll chance */
 const chance=.015+save.baitLuck*.04;

 if(Math.random()<chance){
   const scroll=scrollList[Math.floor(Math.random()*scrollList.length)];
   save.scrolls[scroll]=(save.scrolls[scroll]||0)+1;
   showFishCatch(`📜 MUTANT SCROLL FOUND: ${scroll}!`);
 }else{
   showFishCatch(`🐟 Caught ${f.name}! +$${f.value}`);
 }

 saveGame();
 updateHUD();

 if(inventory.length>=save.capacity){
   setTimeout(finishFishing,700);
 }
}

function showFishCatch(text){
 document.getElementById("catchText").textContent=text;
}

/* ---------------- FISHING TOUCH / MOUSE ---------------- */

function moveHook(x,y){
 if(!fishing)return;

 hook.x=Math.max(25,Math.min(W-25,x));
 hook.y=Math.max(H*.14,Math.min(H*.86,y));
}

fishCanvas.addEventListener("mousemove",e=>{
 if(fishing)moveHook(e.clientX,e.clientY);
});

fishCanvas.addEventListener("touchmove",e=>{
 if(fishing){
   const t=e.touches[0];
   moveHook(t.clientX,t.clientY);
 }
},{passive:true});

/* ---------------- REEL ---------------- */

document.getElementById("reelBtn").onclick=()=>{
 if(!fishing)return;

 let target=H*.15;

 const timer=setInterval(()=>{
   hook.y-=12;

   if(hook.y<=target){
     clearInterval(timer);
     finishFishing();
   }
 },20);
};

document.getElementById("finishBtn").onclick=()=>{
 if(fishing)finishFishing();
};

function finishFishing(){
 if(!fishing)return;

 fishing=false;
 document.getElementById("fishUI").style.display="none";
 updateHUD();

 if(inventory.length){
   showMessage(`Fishing finished! You caught ${inventory.length} fish.`);
 }else{
   showMessage("You didn't catch anything.");
 }
}

/* ---------------- START ---------------- */

let gameStarted=false;

document.getElementById("startBtn").onclick=()=>{
 gameStarted=true;
 document.getElementById("start").style.display="none";

 if("serviceWorker" in navigator){
   navigator.serviceWorker.register("sw.js").catch(()=>{});
 }

 showMessage("Welcome to Fishing Offline! Walk to the dock.");
};

/* ---------------- MAIN DRAW ---------------- */

function draw(){
 ctx.clearRect(0,0,W,H);

 drawSky();

 /* distant mountains */
 const horizon=H*.48+player.pitch*H*.35;
 ctx.fillStyle="#385a70";
 ctx.beginPath();
 ctx.moveTo(0,horizon);
 for(let x=0;x<=W;x+=70){
   const y=horizon-40-Math.sin(x*.011)*35;
   ctx.lineTo(x,y);
 }
 ctx.lineTo(W,horizon);
 ctx.closePath();
 ctx.fill();

 drawGround();

 /* objects sorted by distance */
 const objects=[];

 trees.forEach(t=>objects.push({
   d:Math.hypot(t.x-player.x,t.z-player.z),
   draw:()=>drawTree(t)
 }));

 rocks.forEach(r=>objects.push({
   d:Math.hypot(r.x-player.x,r.z-player.z),
   draw:()=>drawRock(r)
 }));

 shops.forEach(s=>objects.push({
   d:Math.hypot(s.x-player.x,s.z-player.z),
   draw:()=>drawShop(s)
 }));

 objects.push({
   d:Math.hypot(player.x,player.z-25),
   draw:drawDock
 });

 objects.sort((a,b)=>b.d-a.d);

 objects.forEach(o=>o.draw());

 drawRod();

 updateInteraction();
 updateMovement(1/60);

 requestAnimationFrame(draw);
}

draw();

/* ---------------- AUTOSAVE ---------------- */

setInterval(saveGame,5000);

/* ---------------- PREVENT SCROLL ---------------- */

addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)){
   if(gameStarted)e.preventDefault();
 }
});

/* ---------------- MOBILE CAST BUTTON ---------------- */

let holdTimer=null;

document.addEventListener("touchstart",e=>{
 if(!gameStarted||fishing||panelOpen)return;

 const t=e.target;

 if(t===mobileLook||t===joystick||t.closest("button"))return;

 if(nearDock()){
   clearTimeout(holdTimer);
   holdTimer=setTimeout(()=>castStart(),350);
 }
},{passive:true});

</script>

</html>
