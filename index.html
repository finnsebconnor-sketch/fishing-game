<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fishing Offline</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06111b;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

#start{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  background:
    radial-gradient(circle at center,#123d59,#06111b 55%,#02070b);
}

#start h1{
  margin:0;
  font-size:clamp(45px,9vw,100px);
  letter-spacing:9px;
  text-shadow:0 10px 35px #000;
}

#start p{
  letter-spacing:4px;
  opacity:.7;
}

#start button{
  margin-top:30px;
  padding:18px 42px;
  border:0;
  border-radius:14px;
  background:#f2ae3d;
  color:#15100a;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:20;
  display:none;
  color:white;
  background:rgba(3,10,17,.75);
  border:1px solid rgba(255,255,255,.15);
  padding:13px 16px;
  border-radius:14px;
  line-height:1.7;
  backdrop-filter:blur(8px);
}

#message{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  z-index:50;
  display:none;
  background:rgba(0,0,0,.82);
  color:white;
  padding:13px 22px;
  border-radius:12px;
  font-weight:bold;
}

#prompt{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:30;
  display:none;
  background:rgba(0,0,0,.72);
  color:white;
  padding:12px 20px;
  border-radius:12px;
  text-align:center;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  background:white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:15;
  display:none;
  box-shadow:0 0 5px #000;
}

#castButton,
#reelButton{
  position:fixed;
  right:25px;
  z-index:60;
  border:0;
  border-radius:18px;
  width:130px;
  height:58px;
  font-weight:900;
  font-size:16px;
  display:none;
}

#castButton{
  bottom:30px;
  background:#e9a83b;
}

#reelButton{
  bottom:100px;
  background:#58c7ed;
}

#power{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  width:240px;
  height:18px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(0,0,0,.65);
  display:none;
  z-index:61;
}

#powerFill{
  width:0%;
  height:100%;
  background:#f3b33e;
}

#fishingUI{
  position:fixed;
  inset:0;
  z-index:55;
  display:none;
  pointer-events:none;
}

#waterOverlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      rgba(4,73,102,.05),
      rgba(2,30,52,.7)
    );
}

#depthText{
  position:absolute;
  top:25px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-weight:bold;
  font-size:18px;
  text-shadow:0 2px 6px #000;
}

#hook{
  position:absolute;
  width:18px;
  height:18px;
  border:3px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 10px white;
}

.fishIcon{
  position:absolute;
  width:50px;
  height:25px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
}

.fishIcon:after{
  content:"";
  position:absolute;
  right:-13px;
  top:5px;
  width:0;
  height:0;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:15px solid currentColor;
}

#reelBar{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  width:min(400px,75vw);
  height:24px;
  border:2px solid white;
  border-radius:15px;
  overflow:hidden;
  background:#172534;
}

#reelGood{
  position:absolute;
  left:35%;
  width:30%;
  height:100%;
  background:#50c878;
}

#reelMarker{
  position:absolute;
  left:0;
  top:0;
  width:6px;
  height:100%;
  background:white;
}

#reelText{
  position:absolute;
  bottom:65px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#shopPanel{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.7);
}

.panel{
  width:min(650px,92vw);
  max-height:85vh;
  overflow:auto;
  background:#102031;
  color:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 20px 80px #000;
}

.panel button{
  border:0;
  padding:11px 16px;
  margin:5px;
  border-radius:9px;
  background:#e8a93c;
  font-weight:bold;
}

.cardGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.card{
  background:#1a3044;
  padding:15px;
  border-radius:13px;
}

#closePanel{
  float:right;
  background:#304457;
  color:white;
}

#joystick{
  position:fixed;
  bottom:25px;
  left:25px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.2);
  display:none;
  z-index:70;
  touch-action:none;
}

#stick{
  position:absolute;
  width:62px;
  height:62px;
  left:37px;
  top:37px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
}

@media(max-width:800px){
  #joystick{
    display:block;
  }

  #castButton{
    display:block;
  }

  #crosshair{
    display:none;
  }
}
</style>
</head>

<body>

<div id="start">
  <h1>FISHING OFFLINE</h1>
  <p>EXPLORE • CAST • CATCH • UPGRADE</p>
  <button id="startButton">START GAME</button>
</div>

<canvas id="game"></canvas>

<div id="hud">
  💰 $<span id="money">500</span><br>
  🎒 <span id="fishCount">0</span>/<span id="capacity">3</span> fish<br>
  💪 Strength: <span id="strength">10</span><br>
  🌊 Depth: <span id="depth">10</span>m<br>
  🪱 <span id="bait">Basic</span>
</div>

<div id="crosshair"></div>

<div id="message"></div>

<div id="prompt"></div>

<button id="castButton">CAST 🎣</button>
<button id="reelButton">REEL IN</button>

<div id="power">
  <div id="powerFill"></div>
</div>

<div id="fishingUI">
  <div id="waterOverlay"></div>
  <div id="depthText">DEPTH: 0m</div>
  <div id="hook"></div>

  <div id="reelText">KEEP THE MARKER IN THE GREEN!</div>

  <div id="reelBar">
    <div id="reelGood"></div>
    <div id="reelMarker"></div>
  </div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="shopPanel">
  <div class="panel">
    <button id="closePanel">CLOSE</button>
    <h2 id="panelTitle"></h2>
    <div id="panelContent"></div>
  </div>
</div>

<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
}

resize();
addEventListener("resize",resize);


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY="FishingOfflineSaveV3";

let save={
  money:500,
  capacity:3,
  strength:10,
  depth:10,
  baitLuck:0,
  bait:"Basic",
  fish:{},
  scrolls:{}
};

try{
  const old=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(old) save={...save,...old};
}catch(e){}

function saveGame(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
}


/* =========================================================
   PLAYER
========================================================= */

const player={
  x:0,
  z:-13,
  yaw:0,
  pitch:0,
  speed:7
};

const keys={};

document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e"){
    interact();
  }
});

document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});


/* =========================================================
   MOUSE LOOK
========================================================= */

let mouseLook=false;
let lastX=0;
let lastY=0;

canvas.addEventListener("mousedown",e=>{
  if(!gameStarted) return;

  if(!isTouch()){
    mouseLook=true;
    lastX=e.clientX;
    lastY=e.clientY;
  }
});

addEventListener("mouseup",()=>{
  mouseLook=false;
});

addEventListener("mousemove",e=>{

  if(!mouseLook || fishing) return;

  player.yaw+=(e.clientX-lastX)*.004;
  player.pitch-=(e.clientY-lastY)*.002;

  player.pitch=Math.max(-.6,Math.min(.6,player.pitch));

  lastX=e.clientX;
  lastY=e.clientY;
});


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyActive=false;

joystick.addEventListener("pointerdown",e=>{
  joyActive=true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
  if(joyActive) updateJoystick(e);
});

joystick.addEventListener("pointerup",()=>{
  joyActive=false;
  joyX=0;
  joyY=0;
  stick.style.left="37px";
  stick.style.top="37px";
});

function updateJoystick(e){

  const r=joystick.getBoundingClientRect();

  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);

  const max=40;
  const length=Math.hypot(x,y);

  if(length>max){
    x=x/length*max;
    y=y/length*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.left=(37+x)+"px";
  stick.style.top=(37+y)+"px";
}

function isTouch(){
  return navigator.maxTouchPoints>0;
}


/* =========================================================
   WORLD
========================================================= */

const island={
  radiusX:47,
  radiusZ:40
};

const dock={
  x:0,
  start:-1,
  end:38,
  width:9
};

const shops=[
  {
    id:"sell",
    x:-28,
    z:-4,
    w:9,
    h:5,
    color:"#b8753b",
    name:"FISH MARKET"
  },
  {
    id:"rod",
    x:28,
    z:-4,
    w:10,
    h:5,
    color:"#477b98",
    name:"ROD SHOP"
  },
  {
    id:"bait",
    x:-25,
    z:-24,
    w:9,
    h:4,
    color:"#508449",
    name:"BAIT SHOP"
  },
  {
    id:"museum",
    x:25,
    z:-24,
    w:12,
    h:5,
    color:"#8254a4",
    name:"FISH MUSEUM"
  }
];


/* =========================================================
   FISH
========================================================= */

const fishTypes=[
  {
    name:"Minnow",
    rarity:"Common",
    value:8,
    depth:2,
    strength:3
  },
  {
    name:"Bluegill",
    rarity:"Common",
    value:15,
    depth:4,
    strength:6
  },
  {
    name:"Bass",
    rarity:"Uncommon",
    value:30,
    depth:7,
    strength:12
  },
  {
    name:"Trout",
    rarity:"Uncommon",
    value:45,
    depth:10,
    strength:18
  },
  {
    name:"Salmon",
    rarity:"Rare",
    value:90,
    depth:15,
    strength:25
  },
  {
    name:"Golden Carp",
    rarity:"Rare",
    value:150,
    depth:20,
    strength:35
  },
  {
    name:"Swordfish",
    rarity:"Epic",
    value:300,
    depth:25,
    strength:50
  },
  {
    name:"Crystal Fish",
    rarity:"Epic",
    value:500,
    depth:30,
    strength:65
  },
  {
    name:"Ancient Koi",
    rarity:"Legendary",
    value:1200,
    depth:40,
    strength:80
  },
  {
    name:"Sea Dragon",
    rarity:"Mythic",
    value:3500,
    depth:50,
    strength:100
  },
  {
    name:"Void Eel",
    rarity:"Mythic",
    value:6000,
    depth:60,
    strength:125
  },
  {
    name:"Titan Tuna",
    rarity:"Legendary",
    value:9000,
    depth:70,
    strength:150
  }
];

const scrolls=[
  "Shadow Scroll",
  "Golden Scroll",
  "Crystal Scroll",
  "Void Scroll",
  "Ancient Scroll"
];


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;

let fishing=false;
let casting=false;
let castPower=0;

let fishingPhase="idle";

let hookDepth=0;

let underwaterFish=[];

let caughtThisCast=[];

let biteFish=null;

let reelPosition=0;
let reelDirection=1;

let reelTime=0;


/* =========================================================
   START
========================================================= */

document.getElementById("startButton").onclick=()=>{

  gameStarted=true;

  document.getElementById("start").style.display="none";
  document.getElementById("hud").style.display="block";
  document.getElementById("crosshair").style.display="block";

  updateHUD();

  showMessage(
    "WASD = move • Mouse = look • Walk to the dock and cast!"
  );

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
};


/* =========================================================
   MOVEMENT
========================================================= */

function onDock(x,z){

  return (
    x>-dock.width/2 &&
    x<dock.width/2 &&
    z>dock.start &&
    z<dock.end
  );
}

function onIsland(x,z){

  const nx=x/island.radiusX;
  const nz=(z+5)/island.radiusZ;

  return nx*nx+nz*nz<1;
}

function blocked(x,z){

  for(const s of shops){

    if(
      x>s.x-s.w/2 &&
      x<s.x+s.w/2 &&
      z>s.z-4 &&
      z<s.z+4
    ){
      return true;
    }
  }

  return false;
}

function movePlayer(dt){

  if(!gameStarted || fishing) return;

  let forward=0;
  let side=0;

  if(keys["w"]) forward++;
  if(keys["s"]) forward--;

  if(keys["a"]) side--;
  if(keys["d"]) side++;

  forward-=joyY;
  side+=joyX;

  const length=Math.hypot(forward,side);

  if(length===0) return;

  forward/=length;
  side/=length;

  const dx=
    Math.sin(player.yaw)*forward+
    Math.cos(player.yaw)*side;

  const dz=
    Math.cos(player.yaw)*forward-
    Math.sin(player.yaw)*side;

  const nx=player.x+dx*player.speed*dt;
  const nz=player.z+dz*player.speed*dt;

  if(onDock(nx,nz)||onIsland(nx,nz)){

    if(!blocked(nx,nz)){

      player.x=nx;
      player.z=nz;

    }
  }
}


/* =========================================================
   INTERACTION
========================================================= */

function interact(){

  if(fishing) return;

  for(const shop of shops){

    const d=Math.hypot(
      player.x-shop.x,
      player.z-shop.z
    );

    if(d<7){

      if(shop.id==="sell") openSell();
      if(shop.id==="rod") openRod();
      if(shop.id==="bait") openBait();
      if(shop.id==="museum") openMuseum();

      return;
    }
  }
}

function updatePrompt(){

  const prompt=document.getElementById("prompt");

  if(fishing){
    prompt.style.display="none";
    return;
  }

  for(const shop of shops){

    const d=Math.hypot(
      player.x-shop.x,
      player.z-shop.z
    );

    if(d<7){

      prompt.style.display="block";
      prompt.textContent=
        "PRESS E — "+shop.name;

      return;
    }
  }

  if(onDock(player.x,player.z)){

    prompt.style.display="block";

    prompt.textContent=
      isTouch()
      ? "TAP CAST TO FISH"
      : "SPACE — CAST YOUR ROD";

    return;
  }

  prompt.style.display="none";
}


/* =========================================================
   CASTING
========================================================= */

function startCasting(){

  if(fishing) return;

  if(!onDock(player.x,player.z)){

    showMessage("Walk onto the fishing dock first!");

    return;
  }

  if(getFishCount()>=save.capacity){

    showMessage("Your fish bag is full!");

    return;
  }

  casting=true;
  castPower=0;

  document.getElementById("power").style.display="block";
}

function releaseCast(){

  if(!casting) return;

  casting=false;

  document.getElementById("power").style.display="none";

  beginFishing();
}

document.addEventListener("keydown",e=>{

  if(e.code==="Space" && gameStarted){

    if(!casting && !fishing){
      startCasting();
    }
  }

});

document.addEventListener("keyup",e=>{

  if(e.code==="Space" && casting){
    releaseCast();
  }

});

const castButton=document.getElementById("castButton");

castButton.addEventListener("pointerdown",()=>{
  if(!fishing) startCasting();
});

castButton.addEventListener("pointerup",()=>{
  if(casting) releaseCast();
});


/* =========================================================
   BEGIN FISHING
========================================================= */

function beginFishing(){

  fishing=true;

  fishingPhase="wait";

  hookDepth=0;

  caughtThisCast=[];

  document.getElementById("fishingUI").style.display="block";

  document.getElementById("reelButton").style.display="block";

  spawnUnderwaterFish();

  showMessage("Your line is in the water...");

  setTimeout(()=>{

    if(!fishing) return;

    fishingPhase="down";

    showMessage("Move the hook around to find fish!");

  },1200);
}


/* =========================================================
   UNDERWATER FISH
========================================================= */

function spawnUnderwaterFish(){

  underwaterFish=[];

  const number=12+Math.floor(castPower*8);

  for(let i=0;i<number;i++){

    let possible=
      fishTypes.filter(f=>f.depth<=save.depth);

    if(!possible.length){
      possible=[fishTypes[0]];
    }

    let fish=
      possible[Math.floor(Math.random()*possible.length)];

    const depth=
      Math.max(
        2,
        Math.min(
          save.depth,
          fish.depth+(Math.random()*5-2)
        )
      );

    underwaterFish.push({

      type:fish,

      x:8+Math.random()*84,

      y:18+Math.random()*72,

      depth:depth,

      speed:.2+Math.random()*.5,

      direction:Math.random()<.5?-1:1,

      caught:false

    });
  }
}


/* =========================================================
   FISHING MOVEMENT
========================================================= */

let hookX=50;
let hookY=20;

document.getElementById("fishingUI").addEventListener("pointermove",e=>{

  if(!fishing) return;

  hookX=e.clientX/W*100;
  hookY=e.clientY/H*100;

});

document.getElementById("fishingUI").addEventListener("pointerdown",e=>{

  if(!fishing) return;

  hookX=e.clientX/W*100;
  hookY=e.clientY/H*100;

});


function updateFishing(dt){

  if(!fishing) return;

  /* hook keyboard movement */

  if(keys["a"]) hookX-=35*dt;
  if(keys["d"]) hookX+=35*dt;
  if(keys["w"]) hookY-=30*dt;
  if(keys["s"]) hookY+=30*dt;

  hookX=Math.max(5,Math.min(95,hookX));
  hookY=Math.max(12,Math.min(94,hookY));

  hookDepth=
    Math.max(
      1,
      Math.floor(
        ((hookY-12)/82)*save.depth
      )
    );

  document.getElementById("hook").style.left=hookX+"%";
  document.getElementById("hook").style.top=hookY+"%";

  document.getElementById("depthText").textContent=
    "DEPTH: "+hookDepth+"m";

  /* move fish */

  for(const f of underwaterFish){

    if(f.caught) continue;

    f.x+=f.direction*f.speed*dt;

    if(f.x>98){
      f.x=98;
      f.direction=-1;
    }

    if(f.x<2){
      f.x=2;
      f.direction=1;
    }

    checkFishCollision(f);
  }

  drawUnderwaterFish();

}


/* =========================================================
   FISH COLLISION
========================================================= */

function checkFishCollision(f){

  if(f.caught) return;

  if(
    Math.abs(f.x-hookX)<6 &&
    Math.abs(f.y-hookY)<6 &&
    Math.abs(f.depth-hookDepth)<4
  ){

    catchUnderwaterFish(f);

  }
}

function catchUnderwaterFish(f){

  if(getFishCount()>=save.capacity){

    showMessage("Fish bag full! Reel in!");

    return;
  }

  f.caught=true;

  save.fish[f.type.name]=
    (save.fish[f.type.name]||0)+1;

  caughtThisCast.push(f.type);

  updateHUD();

  showMessage(
    "🐟 "+f.type.rarity+" "+f.type.name+
    " caught! $"+f.type.value
  );

  /* mutant scroll */

  if(Math.random()<.018*(1+save.baitLuck)){

    const scroll=
      scrolls[Math.floor(Math.random()*scrolls.length)];

    save.scrolls[scroll]=
      (save.scrolls[scroll]||0)+1;

    showMessage("📜 MUTANT SCROLL FOUND: "+scroll);

  }

  saveGame();

}


/* =========================================================
   DRAW UNDERWATER FISH
========================================================= */

function drawUnderwaterFish(){

  document
    .querySelectorAll(".fishIcon")
    .forEach(e=>e.remove());

  for(const f of underwaterFish){

    if(f.caught) continue;

    if(Math.abs(f.depth-hookDepth)>12) continue;

    const el=document.createElement("div");

    el.className="fishIcon";

    el.style.left=f.x+"%";
    el.style.top=f.y+"%";

    const colors={
      Common:"#d7e1e7",
      Uncommon:"#55d59a",
      Rare:"#4b9cff",
      Epic:"#c36cff",
      Legendary:"#ffd34d",
      Mythic:"#ff4d73"
    };

    el.style.background=
      colors[f.type.rarity]||"white";

    el.style.color=
      colors[f.type.rarity]||"white";

    document.getElementById("fishingUI").appendChild(el);
  }
}


/* =========================================================
   REELING
========================================================= */

const reelButton=document.getElementById("reelButton");

reelButton.onclick=()=>{

  if(!fishing) return;

  if(fishingPhase==="down" || fishingPhase==="wait"){

    fishingPhase="reel";

    reelPosition=0;
    reelDirection=1;
    reelTime=0;

    document.getElementById("reelText").textContent=
      "REEL! KEEP THE MARKER IN THE GREEN!";

    showMessage("REELING! Keep the marker in the green!");

  }else if(fishingPhase==="reel"){

    finishReeling();

  }

};


function updateReeling(dt){

  if(!fishing || fishingPhase!=="reel") return;

  reelTime+=dt;

  reelPosition+=reelDirection*dt*.7;

  if(reelPosition>=1){
    reelPosition=1;
    reelDirection=-1;
  }

  if(reelPosition<=0){
    reelPosition=0;
    reelDirection=1;
  }

  document.getElementById("reelMarker").style.left=
    (reelPosition*100)+"%";

  /* automatically make it a little challenging */

  if(reelTime>1.2){

    const inGreen=
      reelPosition>.35 &&
      reelPosition<.65;

    if(!inGreen){

      const fish=
        caughtThisCast[caughtThisCast.length-1];

      if(
        fish &&
        fish.strength>save.strength
      ){

        showMessage(
          "The fish was too strong! Upgrade your rod."
        );

        finishFishing();

        return;
      }
    }

    reelTime=0;
  }
}

function finishReeling(){

  const count=caughtThisCast.length;

  if(count===0){

    showMessage("Nothing caught this time.");

  }else{

    let total=0;

    for(const f of caughtThisCast){
      total+=f.value;
    }

    showMessage(
      "🎣 You landed "+count+
      " fish worth $"+total+"!"
    );
  }

  fishing=false;
  fishingPhase="idle";

  document.getElementById("fishingUI").style.display="none";
  document.getElementById("reelButton").style.display="none";

  document
    .querySelectorAll(".fishIcon")
    .forEach(e=>e.remove());

  saveGame();
}

  for(const name in save.fish){

}

function updateHUD(){

}

========================================================= */

function openPanel(title,content){

  document.getElementById("panelTitle").textContent=title;
  document.getElementById("panelContent").innerHTML=content;

}

/* SELL */

function openSell(){

  let total=0;

  for(const f of fishTypes){
    total+=(save.fish[f.name]||0)*f.value;
  }

  openPanel(
    "FISH MARKET",
    `
    <p>Your fish are worth:</p>
    <h2>$${total}</h2>
    <button onclick="sellFish()">SELL ALL FISH</button>
    `
  );
}

function sellFish(){

  let total=0;

  for(const f of fishTypes){

    const amount=save.fish[f.name]||0;

    total+=amount*f.value;

    save.fish[f.name]=0;
  }

  save.money+=total;

  saveGame();
  updateHUD();

  document.getElementById("shopPanel").style.display="none";

  showMessage("Sold everything for $"+total+"!");
}

        <p>$${strengthCost}</p>

function buyCapacity(){

  save.money-=cost;
  save.capacity++;

  saveGame();
  updateHUD();
  openRod();
}

function buyStrength(){

  const cost=500+save.strength*35;

  if(save.money<cost){
    showMessage("Not enough money!");
    return;
  }

  save.money-=cost;
  save.strength+=10;

  saveGame();
  updateHUD();
  openRod();
}

function buyDepth(){

  const cost=900+save.depth*100;

  if(save.money<cost){
    showMessage("Not enough money!");
    return;
  }

  save.money-=cost;
  save.depth+=5;

  saveGame();
  updateHUD();
  openRod();
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

  const el=document.getElementById("message");

  el.textContent=text;
  el.style.display="block";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    el.style.display="none";
  },2600);

/* =========================================================
   3D WORLD PROJECTION
========================================================= */

function project(x,y,z){

  const dx=x-player.x;
  const dz=z-player.z;

  const sin=Math.sin(player.yaw);
  const cos=Math.cos(player.yaw);

  const forward=
    dz*cos+
    dx*sin;

  const side=
    dx*cos-
    dz*sin;

  if(forward<.5) return null;

  const scale=650/forward;

  return {

    x:W/2+side*scale,

    y:
      H*.54
      -y*scale
      +player.pitch*scale*1.7

  };
}


/* =========================================================
   SKY
========================================================= */

function drawSky(){

  const gradient=ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#3e91c5");
  gradient.addColorStop(.5,"#a8dcec");
  gradient.addColorStop(1,"#e4c77d");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  /* sun */

  ctx.fillStyle="rgba(255,244,184,.9)";

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.18,
    42,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* mountains */

  ctx.fillStyle="#526f78";

  ctx.beginPath();

  ctx.moveTo(0,H*.55);
  ctx.lineTo(W*.12,H*.37);
  ctx.lineTo(W*.24,H*.51);
  ctx.lineTo(W*.38,H*.31);
  ctx.lineTo(W*.54,H*.5);
  ctx.lineTo(W*.7,H*.34);
  ctx.lineTo(W*.86,H*.5);
  ctx.lineTo(W,H*.35);
  ctx.lineTo(W,H*.65);
  ctx.lineTo(0,H*.65);

  ctx.fill();
}


/* =========================================================
   WATER
========================================================= */

function drawWater(){

  ctx.fillStyle="#086b86";

  ctx.fillRect(
    0,
    H*.48,
    W,
    H*.52
  );

  for(let i=0;i<35;i++){

    const y=
      H*.49+
      i*22+
      Math.sin(performance.now()/1000+i)*4;

    ctx.strokeStyle="rgba(210,245,255,.14)";
    ctx.lineWidth=2;

    ctx.beginPath();

    for(let x=0;x<W;x+=30){

      const wave=
        Math.sin(
          x*.025+
          i+
          performance.now()/700
        )*4;

      if(x===0){
        ctx.moveTo(x,y+wave);
      }else{
        ctx.lineTo(x,y+wave);
      }

    }

    ctx.stroke();
  }
}


/* =========================================================
   ISLAND
========================================================= */

function drawIsland(){

  ctx.fillStyle="#6ea04d";

  ctx.beginPath();

  ctx.ellipse(
    W/2,
    H*.69,
    W*.49,
    H*.34,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* beach */

  ctx.strokeStyle="#d7bd72";
  ctx.lineWidth=22;

  ctx.beginPath();

  ctx.ellipse(
    W/2,
    H*.69,
    W*.46,
    H*.31,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /* central grass area */

  ctx.fillStyle="#78aa54";

  ctx.beginPath();

  ctx.ellipse(
    W/2,
    H*.68,
    W*.39,
    H*.26,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   PATHS
========================================================= */

function drawPath(x1,z1,x2,z2){

  const a=project(x1,.03,z1);
  const b=project(x2,.03,z2);

  if(!a||!b) return;

  ctx.strokeStyle="#c8a66d";
  ctx.lineWidth=70;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();

  ctx.strokeStyle="#d9ba7c";
  ctx.lineWidth=52;

  ctx.beginPath();
  ctx.moveTo(a.x,a.y-2);
  ctx.lineTo(b.x,b.y-2);
  ctx.stroke();
}


/* =========================================================
   SHOP BUILDINGS
========================================================= */

function drawShop(shop){

  const p=project(shop.x,0,shop.z);

  if(!p) return;

  const distance=
    Math.max(
      2,
      Math.hypot(
        shop.x-player.x,
        shop.z-player.z
      )
    );

  const s=Math.max(15,520/distance);

  /* ground shadow */

  ctx.fillStyle="rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y+8,
    s*.7,
    s*.22,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* foundation */

  ctx.fillStyle="#625d55";

  ctx.fillRect(
    p.x-s*.55,
    p.y-s*.02,
    s*1.1,
    s*.12
  );


  /* building */

  ctx.fillStyle=shop.color;

  ctx.fillRect(
    p.x-s*.5,
    p.y-s*.52,
    s,
    s*.55
  );


  /* roof */

  ctx.fillStyle="#3c2b25";

  ctx.beginPath();

  ctx.moveTo(
    p.x-s*.63,
    p.y-s*.52
  );

  ctx.lineTo(
    p.x,
    p.y-s*.87
  );

  ctx.lineTo(
    p.x+s*.63,
    p.y-s*.52
  );

  ctx.closePath();

  ctx.fill();


  /* door */

  ctx.fillStyle="#38261c";

  ctx.fillRect(
    p.x-s*.11,
    p.y-s*.25,
    s*.22,
    s*.28
  );


  /* windows */

  ctx.fillStyle="#bdeeff";

  ctx.fillRect(
    p.x-s*.36,
    p.y-s*.35,
    s*.18,
    s*.15
  );

  ctx.fillRect(
    p.x+s*.18,
    p.y-s*.35,
    s*.18,
    s*.15
  );


  /* sign */

  ctx.fillStyle="#e3c26b";

  ctx.fillRect(
    p.x-s*.5,
    p.y-s*.99,
    s,
    s*.2
  );

  ctx.fillStyle="#191512";

  ctx.font=Math.max(8,s*.075)+"px Arial";
  ctx.textAlign="center";

  ctx.fillText(
    shop.name,
    p.x,
    p.y-s*.84
  );
}


/* =========================================================
   DOCK
========================================================= */

function drawDock(){

  const nearLeft=project(
    -dock.width/2,
    .3,
    dock.start
  );

  const nearRight=project(
    dock.width/2,
    .3,
    dock.start
  );

  const farLeft=project(
    -dock.width/2,
    .3,
    dock.end
  );

  const farRight=project(
    dock.width/2,
    .3,
    dock.end
  );

  if(!nearLeft||!nearRight||!farLeft||!farRight) return;


  /* dock */

  ctx.fillStyle="#754829";

  ctx.beginPath();

  ctx.moveTo(nearLeft.x,nearLeft.y);
  ctx.lineTo(nearRight.x,nearRight.y);
  ctx.lineTo(farRight.x,farRight.y);
  ctx.lineTo(farLeft.x,farLeft.y);

  ctx.closePath();

  ctx.fill();


  /* boards */

  for(let z=dock.start;z<dock.end;z+=1.2){

    const a=project(
      -dock.width/2,
      .38,
      z
    );

    const b=project(
      dock.width/2,
      .38,
      z
    );

    if(!a||!b) continue;

    ctx.strokeStyle="#aa6b3a";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);

    ctx.stroke();
  }


  /* posts */

  for(let z=dock.start;z<dock.end;z+=4){

    for(const side of [-1,1]){

      const bottom=project(
        side*dock.width/2,
        .1,
        z
      );

      const top=project(
        side*dock.width/2,
        1.6,
        z
      );

      if(!bottom||!top) continue;

      ctx.strokeStyle="#4b2d1d";
      ctx.lineWidth=6;

      ctx.beginPath();

      ctx.moveTo(bottom.x,bottom.y);
      ctx.lineTo(top.x,top.y);

      ctx.stroke();
    }
  }


  /* rails */

  for(const side of [-1,1]){

    const a=project(
      side*dock.width/2,
      1.6,
      dock.start
    );

    const b=project(
      side*dock.width/2,
      1.6,
      dock.end
    );

    if(!a||!b) continue;

    ctx.strokeStyle="#80512e";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);

    ctx.stroke();
  }


  /* sign */

  const sign=project(
    0,
    2.2,
    8
  );

  if(sign){

    ctx.fillStyle="#e2bb61";

    ctx.fillRect(
      sign.x-50,
      sign.y-25,
      100,
      45
    );

    ctx.fillStyle="#21170f";

    ctx.font="bold 14px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "FISHING",
      sign.x,
      sign.y+4
    );
  }
}


/* =========================================================
   TREES
========================================================= */

const trees=[
  [-38,-10],
  [-37,7],
  [-33,-24],
  [-18,-28],
  [17,-30],
  [36,-24],
  [39,8],
  [32,17],
  [-17,11],
  [18,12],
  [-5,-28],
  [7,-31]
];

function drawTree(x,z){

  const p=project(x,0,z);

  if(!p) return;

  const d=Math.max(2,
    Math.hypot(
      x-player.x,
      z-player.z
    )
  );

  const s=Math.max(12,300/d);

  ctx.fillStyle="rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y+6,
    s*.55,
    s*.2,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#593823";

  ctx.fillRect(
    p.x-s*.08,
    p.y-s*.2,
    s*.16,
    s*.55
  );


  ctx.fillStyle="#245e38";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-s*.42,
    s*.4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x-s*.27,
    p.y-s*.27,
    s*.28,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x+s*.27,
    p.y-s*.27,
    s*.28,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   WORLD RENDER
========================================================= */

function render(){

  drawSky();

  drawWater();

  drawIsland();

  /* paths */

  drawPath(0,-13,-28,-4);
  drawPath(0,-13,28,-4);
  drawPath(-5,-13,-25,-24);
  drawPath(5,-13,25,-24);
  drawPath(0,-13,0,-1);

  /* trees */

  trees.forEach(t=>{
    drawTree(t[0],t[1]);
  });

  /* shops */

  shops.forEach(s=>{
    drawShop(s);
  });

  /* dock */

  drawDock();

  /* vignette */

  const v=ctx.createRadialGradient(
    W/2,H/2,100,
    W/2,H/2,Math.max(W,H)*.7
  );

  v.addColorStop(0,"rgba(0,0,0,0)");
  v.addColorStop(1,"rgba(0,0,0,.28)");

  ctx.fillStyle=v;
  ctx.fillRect(0,0,W,H);
}


/* =========================================================
   MAIN LOOP
========================================================= */

let last=performance.now();

function loop(now){

  const dt=Math.min(.05,(now-last)/1000);

  last=now;

  if(gameStarted){

    if(casting){

      castPower+=dt*.7;

      if(castPower>1){
        castPower=1;
      }

      document.getElementById("powerFill").style.width=
        (castPower*100)+"%";
    }

    movePlayer(dt);

    updatePrompt();

    if(fishing){

      updateFishing(dt);
      updateReeling(dt);

    }

    render();

  }else{

    render();

  }

  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);

</script>
