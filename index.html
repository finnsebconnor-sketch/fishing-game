<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fishing Offline</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07131d;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}
canvas{display:block}
#game{
  width:100%;
  height:100%;
  cursor:crosshair;
}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}
.logo{
  font-size:22px;
  font-weight:900;
  text-shadow:0 3px 8px #000;
}
.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.stat{
  background:rgba(5,13,20,.72);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:8px 11px;
  backdrop-filter:blur(8px);
  font-weight:bold;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
  z-index:8;
  pointer-events:none;
}
#crosshair:before,#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}
#crosshair:before{width:22px;height:2px;top:10px}
#crosshair:after{width:2px;height:22px;left:10px}

#prompt{
  position:fixed;
  bottom:92px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 18px;
  background:rgba(0,0,0,.75);
  border-radius:13px;
  display:none;
  z-index:12;
  font-weight:bold;
}

#toast{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.85);
  border-radius:12px;
  padding:12px 20px;
  z-index:100;
  display:none;
  font-weight:bold;
}

#buttons{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:15;
  display:flex;
  gap:9px;
}
button{
  border:0;
  padding:12px 16px;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-weight:900;
  cursor:pointer;
}
button.dark{
  background:#101b23;
  color:#fff;
  border:1px solid #53616b;
}
button:hover{filter:brightness(1.1)}

#joystick{
  position:fixed;
  left:24px;
  bottom:24px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.2);
  z-index:20;
  display:none;
}
#stick{
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  position:absolute;
  left:37px;
  top:37px;
}

/* menus */
#modal,#catchModal{
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.panel{
  width:min(650px,94vw);
  max-height:88vh;
  overflow:auto;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(145deg,#172a35,#081219);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 25px 90px #000;
}
.panel h1{margin-top:0}
.item{
  margin:10px 0;
  padding:15px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.small{
  color:#aebbc2;
  font-size:13px;
  margin-top:4px;
}
.good{color:#65e6ad}

/* fishing screen */
#fishing{
  position:fixed;
  inset:0;
  z-index:70;
  display:none;
  overflow:hidden;
  background:#05263b;
}

#water{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 5%,rgba(130,235,255,.45),transparent 28%),
    linear-gradient(#1590b1 0%,#086482 28%,#043b56 55%,#021c30 100%);
}

#water::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 2px,
      transparent 2px,
      transparent 17px
    );
  pointer-events:none;
}

#fishCanvas{
  position:absolute;
  inset:0;
}

#fishingTop{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  z-index:3;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

#fishingHelp{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  background:rgba(0,0,0,.6);
  padding:12px 18px;
  border-radius:14px;
  z-index:5;
  width:min(560px,90vw);
}

#depthBar{
  position:absolute;
  right:20px;
  top:80px;
  width:18px;
  height:220px;
  background:rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.7);
  border-radius:20px;
  overflow:hidden;
}
#depthFill{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:0;
  background:linear-gradient(#48d8ff,#2868ff);
}

#caughtBox{
  position:absolute;
  top:75px;
  left:20px;
  background:rgba(0,0,0,.55);
  border-radius:13px;
  padding:10px 13px;
  z-index:4;
}

/* cast power */
#castPowerBox{
  position:fixed;
  left:50%;
  bottom:115px;
  transform:translateX(-50%);
  width:280px;
  display:none;
  z-index:25;
  text-align:center;
  text-shadow:0 2px 4px #000;
}
#castBar{
  height:18px;
  background:#111;
  border:2px solid #fff;
  border-radius:20px;
  overflow:hidden;
}
#castFill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#36d17b,#ffe066,#ff6b6b);
}

@media(max-width:700px){
  #joystick{display:block}
  .stats{font-size:11px}
  .stat{padding:6px 8px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="logo">🎣 FISHING OFFLINE</div>
  <div class="stats">
    <div class="stat">💰 $<span id="money">500</span></div>
    <div class="stat">🎒 <span id="capacity">1</span></div>
    <div class="stat">💪 <span id="strength">10</span></div>
    <div class="stat">🌊 <span id="depth">5</span>m</div>
  </div>
</div>

<div id="crosshair"></div>
<div id="prompt"></div>
<div id="toast"></div>

<div id="buttons">
  <button id="castButton">🎣 CAST</button>
  <button id="eButton" class="dark">E</button>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="castPowerBox">
  CAST POWER
  <div id="castBar">
    <div id="castFill"></div>
  </div>
</div>

<div id="modal">
  <div class="panel">
    <h1 id="modalTitle">Shop</h1>
    <div id="modalContent"></div>
    <br>
    <button id="closeModal">Close</button>
  </div>
</div>

<div id="catchModal">
  <div class="panel" style="text-align:center">
    <h1 id="catchTitle"></h1>
    <div id="catchContent"></div>
    <br>
    <button id="closeCatch">Continue</button>
  </div>
</div>

<div id="fishing">
  <div id="water"></div>
  <canvas id="fishCanvas"></canvas>

  <div id="fishingTop">
    <div>🎣 UNDERWATER</div>
    <div>DEPTH: <span id="depthNumber">0</span>m</div>
  </div>

  <div id="caughtBox">
    🐟 Fish: <span id="caughtCount">0</span>/<span id="caughtMax">1</span>
  </div>

  <div id="depthBar">
    <div id="depthFill"></div>
  </div>

  <div id="fishingHelp">
    <b>MOVE YOUR MOUSE</b> to guide the hook toward fish.<br>
    Catch as many as your rod capacity allows, then reel back up!
  </div>
</div>

<script>
/* =====================================================
   FISHING OFFLINE — BIG UPGRADE
   ===================================================== */

const game=document.getElementById("game");
const ctx=game.getContext("2d");

const fishCanvas=document.getElementById("fishCanvas");
const fctx=fishCanvas.getContext("2d");

let W=innerWidth,H=innerHeight;

function resize(){
  W=game.width=innerWidth;
  H=game.height=innerHeight;
  fishCanvas.width=W;
  fishCanvas.height=H;
}
resize();
addEventListener("resize",resize);

/* =====================================================
   SAVE
   ===================================================== */

const SAVE_KEY="fishingOfflineBigSave";

let save={
  money:500,
  capacity:1,
  strength:10,
  depth:5,
  baitLuck:0,
  fish:{},
  scrolls:{}
};

try{
  const stored=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(stored) save={...save,...stored};
}catch(e){}

function saveGame(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
}

function hud(){
  money.textContent=Math.floor(save.money);
  capacity.textContent=save.capacity;
  strength.textContent=save.strength;
  depth.textContent=save.depth;
}

/* =====================================================
   FISH
   ===================================================== */

const fishTypes=[
  {
    name:"Minnow",
    rarity:"Common",
    value:8,
    depth:1,
    strength:3,
    size:13,
    weight:30,
    color:"#eaf7ff"
  },
  {
    name:"Bluegill",
    rarity:"Common",
    value:15,
    depth:2,
    strength:7,
    size:17,
    weight:24,
    color:"#62b5e8"
  },
  {
    name:"Bass",
    rarity:"Uncommon",
    value:30,
    depth:4,
    strength:14,
    size:23,
    weight:16,
    color:"#72c46b"
  },
  {
    name:"Trout",
    rarity:"Uncommon",
    value:45,
    depth:6,
    strength:18,
    size:25,
    weight:12,
    color:"#d4a46c"
  },
  {
    name:"Salmon",
    rarity:"Rare",
    value:90,
    depth:9,
    strength:27,
    size:30,
    weight:7,
    color:"#ff8a65"
  },
  {
    name:"Golden Carp",
    rarity:"Rare",
    value:150,
    depth:12,
    strength:35,
    size:32,
    weight:4,
    color:"#ffd43b"
  },
  {
    name:"Swordfish",
    rarity:"Epic",
    value:300,
    depth:15,
    strength:48,
    size:40,
    weight:2.5,
    color:"#74c0fc"
  },
  {
    name:"Crystal Fish",
    rarity:"Epic",
    value:500,
    depth:18,
    strength:60,
    size:37,
    weight:1.5,
    color:"#d0bfff"
  },
  {
    name:"Ancient Koi",
    rarity:"Legendary",
    value:1200,
    depth:23,
    strength:78,
    size:45,
    weight:.8,
    color:"#ff922b"
  },
  {
    name:"Sea Dragon",
    rarity:"MYTHIC",
    value:3500,
    depth:30,
    strength:100,
    size:62,
    weight:.2,
    color:"#ff4dff"
  }
];

const scrollTypes=[
  "Shadow Scroll",
  "Golden Scroll",
  "Crystal Scroll",
  "Void Scroll",
  "Ancient Scroll"
];

function chooseFish(){
  const available=fishTypes.filter(f=>f.depth<=save.depth);

  let total=available.reduce((a,f)=>a+f.weight,0);
  let r=Math.random()*total;

  for(const f of available){
    r-=f.weight;
    if(r<=0)return f;
  }

  return available[0];
}

/* =====================================================
   PLAYER
   ===================================================== */

let player={
  x:0,
  z:0,
  yaw:0,
  pitch:0,
  speed:.075
};

const worldObjects=[
  {
    x:-13,
    z:4,
    type:"sell",
    name:"SELL SHOP",
    color:"#b84b36"
  },
  {
    x:13,
    z:5,
    type:"rod",
    name:"ROD UPGRADE SHOP",
    color:"#6d48b8"
  },
  {
    x:-11,
    z:-5,
    type:"bait",
    name:"BAIT SHOP",
    color:"#368f63"
  },
  {
    x:10,
    z:-7,
    type:"index",
    name:"FISH MUSEUM",
    color:"#3184ad"
  },
  {
    x:0,
    z:15,
    type:"dock",
    name:"FISHING DOCK",
    color:"#704622"
  }
];

/* =====================================================
   KEYBOARD
   ===================================================== */

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e"){
    interact();
  }

  if(e.code==="Space"){
    if(!fishing)startCast();
  }
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

/* =====================================================
   MOUSE LOOK
   ===================================================== */

let locked=false;

game.addEventListener("click",()=>{
  if(!fishing){
    game.requestPointerLock?.();
  }
});

document.addEventListener("pointerlockchange",()=>{
  locked=document.pointerLockElement===game;
});

document.addEventListener("mousemove",e=>{
  if(!locked || fishing)return;

  player.yaw+=e.movementX*.0028;

  /* THIS IS THE UP/DOWN MOUSE LOOK */
  player.pitch-=e.movementY*.0025;

  player.pitch=Math.max(-1.05,Math.min(1.05,player.pitch));
});

/* =====================================================
   TOUCH LOOK
   ===================================================== */

let lookTouch=null;

game.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;

  lookTouch={
    x:e.touches[0].clientX,
    y:e.touches[0].clientY
  };
},{passive:true});

game.addEventListener("touchmove",e=>{
  if(!lookTouch)return;

  const t=e.touches[0];

  player.yaw+=(t.clientX-lookTouch.x)*.004;
  player.pitch-=(t.clientY-lookTouch.y)*.003;

  player.pitch=Math.max(-1.05,Math.min(1.05,player.pitch));

  lookTouch.x=t.clientX;
  lookTouch.y=t.clientY;
},{passive:true});

game.addEventListener("touchend",()=>{
  lookTouch=null;
});

/* =====================================================
   JOYSTICK
   ===================================================== */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;

joystick.addEventListener("pointermove",e=>{
  if(e.buttons!==1)return;

  const r=joystick.getBoundingClientRect();

  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);

  const max=43;
  const len=Math.hypot(x,y);

  if(len>max){
    x=x/len*max;
    y=y/len*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.transform=`translate(${x}px,${y}px)`;
});

joystick.addEventListener("pointerup",resetJoy);
joystick.addEventListener("pointercancel",resetJoy);

function resetJoy(){
  joyX=0;
  joyY=0;
  stick.style.transform="translate(0,0)";
}

/* =====================================================
   MOVEMENT
   ===================================================== */

function movePlayer(){
  let forward=0;
  let sideways=0;

  if(keys.w)forward++;
  if(keys.s)forward--;
  if(keys.a)sideways--;
  if(keys.d)sideways++;

  forward-=joyY;
  sideways+=joyX;

  const len=Math.hypot(forward,sideways);

  if(!len)return;

  forward/=len;
  sideways/=len;

  const sin=Math.sin(player.yaw);
  const cos=Math.cos(player.yaw);

  player.x+=(sin*forward+cos*sideways)*player.speed;
  player.z+=(cos*forward-sin*sideways)*player.speed;

  /* big island boundaries */
  player.x=Math.max(-18,Math.min(18,player.x));
  player.z=Math.max(-13,Math.min(19,player.z));
}

/* =====================================================
   3D
   ===================================================== */

function project(x,y,z){
  const dx=x-player.x;
  const dz=z-player.z;

  const sin=Math.sin(player.yaw);
  const cos=Math.cos(player.yaw);

  const cameraX=dx*cos-dz*sin;
  const cameraZ=dx*sin+dz*cos;

  if(cameraZ<=.2)return null;

  const focal=760;

  return{
    x:W/2+(cameraX/cameraZ)*focal,
    y:H/2-((y-player.pitch*3.2)/cameraZ)*focal,
    scale:focal/cameraZ,
    z:cameraZ
  };
}

/* =====================================================
   GRAPHICS
   ===================================================== */

function sky(){
  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#173c66");
  g.addColorStop(.28,"#3e8fb5");
  g.addColorStop(.52,"#b6dfdf");
  g.addColorStop(1,"#f2c47b");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* sun */
  const sx=W*.76;
  const sy=H*.20;

  const glow=ctx.createRadialGradient(sx,sy,10,sx,sy,120);
  glow.addColorStop(0,"rgba(255,248,190,.9)");
  glow.addColorStop(1,"rgba(255,220,100,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(sx-120,sy-120,240,240);

  ctx.fillStyle="#fff3b0";
  ctx.beginPath();
  ctx.arc(sx,sy,38,0,Math.PI*2);
  ctx.fill();

  /* clouds */
  for(let i=0;i<6;i++){
    const x=((i*260+80)% (W+300))-100;
    const y=70+(i%3)*55;

    ctx.fillStyle="rgba(255,255,255,.72)";

    ctx.beginPath();
    ctx.arc(x,y,25,0,Math.PI*2);
    ctx.arc(x+35,y-15,36,0,Math.PI*2);
    ctx.arc(x+75,y,28,0,Math.PI*2);
    ctx.fill();
  }
}

function ground(){
  const horizon=H*.48;

  /* distant ocean */
  ctx.fillStyle="#087391";
  ctx.fillRect(0,horizon,W,H-horizon);

  /* island */
  ctx.fillStyle="#d8c27d";

  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0,horizon+90);
  ctx.quadraticCurveTo(W*.18,horizon+20,W*.34,horizon+100);
  ctx.quadraticCurveTo(W*.5,horizon+35,W*.68,horizon+90);
  ctx.quadraticCurveTo(W*.85,horizon+20,W,horizon+75);
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();

  /* grass */
  ctx.fillStyle="#397347";
  ctx.beginPath();
  ctx.moveTo(0,horizon+70);
  ctx.quadraticCurveTo(W*.2,horizon+10,W*.38,horizon+80);
  ctx.quadraticCurveTo(W*.56,horizon+25,W*.76,horizon+70);
  ctx.quadraticCurveTo(W*.9,horizon+20,W,horizon+65);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();

  /* water foreground */
  ctx.fillStyle="#07536e";
  ctx.beginPath();
  ctx.moveTo(0,H*.67);
  ctx.quadraticCurveTo(W*.2,H*.62,W*.4,H*.68);
  ctx.quadraticCurveTo(W*.65,H*.59,W,H*.66);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();

  /* water reflections */
  for(let i=0;i<35;i++){
    const y=H*.68+i*12;
    const offset=Math.sin(Date.now()/1000+i)*20;

    ctx.strokeStyle="rgba(180,235,240,.15)";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(offset,y);
    ctx.quadraticCurveTo(W/2,y-5,W+offset,y);
    ctx.stroke();
  }
}

function tree(x,z,size=1){
  const p=project(x,0,z);

  if(!p)return;

  const s=p.scale*size;

  /* trunk */
  ctx.fillStyle="#5a3822";
  ctx.fillRect(
    p.x-8*s/100,
    p.y-100*s/100,
    16*s/100,
    100*s/100
  );

  /* leaves */
  const colors=["#174d32","#21663a","#2f7b43"];

  for(let i=0;i<4;i++){
    ctx.fillStyle=colors[i%colors.length];

    ctx.beginPath();
    ctx.arc(
      p.x+(i-1.5)*18*s/100,
      p.y-110*s/100-(i%2)*20,
      38*s/100,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}

function building(o){
  const p=project(o.x,0,o.z);

  if(!p)return;

  const s=Math.min(p.scale,400);
  const w=125*s/100;
  const h=90*s/100;

  /* shadow */
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(p.x,p.y+4,w*.7,18*s/100,0,0,Math.PI*2);
  ctx.fill();

  /* building */
  ctx.fillStyle=o.color;
  ctx.fillRect(p.x-w/2,p.y-h,w,h);

  /* side */
  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.moveTo(p.x+w/2,p.y-h);
  ctx.lineTo(p.x+w/2+30*s/100,p.y-h-20*s/100);
  ctx.lineTo(p.x+w/2+30*s/100,p.y-20*s/100);
  ctx.lineTo(p.x+w/2,p.y);
  ctx.closePath();
  ctx.fill();

  /* roof */
  ctx.fillStyle="#202c32";
  ctx.beginPath();
  ctx.moveTo(p.x-w*.62,p.y-h);
  ctx.lineTo(p.x,p.y-h-55*s/100);
  ctx.lineTo(p.x+w*.62,p.y-h);
  ctx.closePath();
  ctx.fill();

  /* windows */
  ctx.fillStyle="#a9e8f5";
  ctx.fillRect(p.x-30*s/100,p.y-62*s/100,23*s/100,25*s/100);
  ctx.fillRect(p.x+8*s/100,p.y-62*s/100,23*s/100,25*s/100);

  /* sign */
  ctx.fillStyle="rgba(0,0,0,.75)";
  ctx.fillRect(
    p.x-w*.62,
    p.y-h-78*s/100,
    w*1.24,
    30*s/100
  );

  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.font=`900 ${Math.max(10,17*s/100)}px Arial`;
  ctx.fillText(o.name,p.x,p.y-h-56*s/100);
}

function dock(){
  for(let i=0;i<14;i++){
    const z=9+i*.7;
    const p=project(0,z*.02,z);

    if(!p)continue;

    const s=p.scale;

    ctx.fillStyle=i%2?"#79502d":"#684222";
    ctx.fillRect(
      p.x-38*s/100,
      p.y-9*s/100,
      76*s/100,
      18*s/100
    );
  }

  /* posts */
  for(let i=0;i<8;i++){
    const p=project(-1.2+i*.34,0,10+i*.9);

    if(!p)continue;

    ctx.fillStyle="#4b301d";
    ctx.fillRect(
      p.x-5*p.scale/100,
      p.y,
      10*p.scale/100,
      55*p.scale/100
    );
  }
}

function rocks(){
  const list=[
    [-8,1],[-4,-4],[5,-2],[9,1],[-14,-5],[14,-3]
  ];

  for(const [x,z] of list){
    const p=project(x,0,z);
    if(!p)continue;

    const s=p.scale;

    ctx.fillStyle="#687477";
    ctx.beginPath();
    ctx.ellipse(
      p.x,
      p.y,
      30*s/100,
      18*s/100,
      0,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}

function firstPersonRod(){
  /* rod */
  ctx.save();

  ctx.translate(W*.72,H*.80);
  ctx.rotate(-.28);

  ctx.strokeStyle="#161b1e";
  ctx.lineWidth=9;

  ctx.beginPath();
  ctx.moveTo(0,150);
  ctx.lineTo(-65,-230);
  ctx.stroke();

  ctx.strokeStyle="#cdd8dc";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-65,-230);
  ctx.lineTo(-160,-380);
  ctx.stroke();

  /* reel */
  ctx.fillStyle="#252d31";
  ctx.beginPath();
  ctx.arc(-5,120,28,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawWorld(){
  sky();
  ground();

  /* distant mountains */
  ctx.fillStyle="rgba(40,80,85,.4)";
  ctx.beginPath();
  ctx.moveTo(0,H*.49);
  ctx.lineTo(W*.12,H*.37);
  ctx.lineTo(W*.23,H*.48);
  ctx.lineTo(W*.38,H*.34);
  ctx.lineTo(W*.52,H*.48);
  ctx.lineTo(W*.68,H*.36);
  ctx.lineTo(W*.82,H*.48);
  ctx.lineTo(W,H*.39);
  ctx.lineTo(W,H*.52);
  ctx.lineTo(0,H*.52);
  ctx.fill();

  rocks();

  [
    [-15,-7,1.2],
    [-7,-8,1],
    [7,-9,1.3],
    [15,-6,1],
    [-15,10,1.2],
    [15,11,1.2],
    [-6,3,.8],
    [8,7,.9]
  ].forEach(t=>tree(...t));

  worldObjects
    .filter(o=>o.type!=="dock")
    .forEach(building);

  dock();
  firstPersonRod();
}

/* =====================================================
   INTERACTION
   ===================================================== */

function nearest(){
  let best=null;
  let dist=999;

  for(const o of worldObjects){
    const d=Math.hypot(
      o.x-player.x,
      o.z-player.z
    );

    if(d<dist){
      dist=d;
      best=o;
    }
  }

  return dist<3.8?best:null;
}

function interact(){
  const o=nearest();

  if(!o){
    showToast("Walk closer to a building.");
    return;
  }

  if(o.type==="sell")sellShop();
  if(o.type==="rod")rodShop();
  if(o.type==="bait")baitShop();
  if(o.type==="index")fishMuseum();
}

function updatePrompt(){
  const p=document.getElementById("prompt");
  const o=nearest();

  if(o){
    p.style.display="block";
    p.textContent=`Press E — ${o.name}`;
  }else{
    p.style.display="none";
  }
}

   SHOPS
   ===================================================== */

const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modalTitle");
const modalContent=document.getElementById("modalContent");

function openModal(title,html){
  modalTitle.textContent=title;
  modalContent.innerHTML=html;
  modal.style.display="flex";
}

document.getElementById("closeModal").onclick=()=>{
  modal.style.display="none";
};

function sellShop(){
  let total=0;

  for(const name in save.fish){
    const f=fishTypes.find(x=>x.name===name);

    if(f){
      total+=f.value*save.fish[name];
    }
  }

  openModal(
    "💰 FISH SELL SHOP",
    `
      <p>Sell everything you caught.</p>

      <div class="item">
        <div>
          <b>Fish waiting to be sold</b>
          <div class="small">Your fish collection stays in your inventory until you sell it.</div>
        </div>
        <b>$${total}</b>
      </div>

      <button id="sellButton">
        SELL ALL — $${total}
      </button>
    `
  );

  document.getElementById("sellButton").onclick=()=>{
    if(total<=0){
      showToast("You have no fish to sell.");
      return;
    }

    save.money+=total;
    save.fish={};

    saveGame();
    hud();

    modal.style.display="none";

    showToast(`Sold your fish for $${total}!`);
  };
}

/* =====================================================
   CASTING
   ===================================================== */

let charging=false;
let castPower=0;
let castInterval=null;

function startCast(){
  if(charging||fishing)return;

  const d=Math.hypot(
    player.x,
    player.z-15
  );

  if(d>5){
    showToast("Walk onto the fishing dock first.");
    return;
  }

  charging=true;
  castPower=0;

  document.getElementById("castPowerBox").style.display="block";

  castInterval=setInterval(()=>{
    castPower+=4;

    if(castPower>=100){
      castPower=100;
      stopCast();
    }

    document.getElementById("castFill").style.width=castPower+"%";
  },35);
}

function stopCast(){
  if(!charging)return;

  charging=false;
  clearInterval(castInterval);

  document.getElementById("castPowerBox").style.display="none";

  beginTinyFishing();
}

document.getElementById("castButton").onclick=()=>{
  if(charging){
    stopCast();
  }else{
    startCast();
  }
};

/* =====================================================
   TINY-FISHING STYLE MECHANIC
   ===================================================== */

let fishing=false;
let hook={
  x:50,
  y:8,
  depth:0,
  speed:0
};

let underwaterFish=[];
let caught=[];
let fishingFrame=0;
let mouseFishing=false;

function beginTinyFishing(){
  fishing=true;
  fishingFrame=0;

  hook.x=50;
  hook.y=8;

  /*
    Cast power controls how far across the water
    the hook starts.
  */
  hook.x=20+castPower*.6;

  hook.depth=0;

  caught=[];

  underwaterFish=[];

  /* Create a whole school of fish */
  for(let i=0;i<24;i++){
    const f=chooseFish();

    underwaterFish.push({
      fish:f,
      x:5+Math.random()*90,
      y:8+Math.random()*85,
      speed:.08+Math.random()*.18,
      direction:Math.random()<.5?-1:1,
      phase:Math.random()*20,
      caught:false
    });
  }

  document.getElementById("fishing").style.display="block";

  document.getElementById("caughtMax").textContent=save.capacity;

  requestAnimationFrame(fishingLoop);
}

/*
  Moving the mouse horizontally moves the hook.
  Moving it vertically changes how deep the player
  sends the hook.
*/
fishCanvas.addEventListener("pointermove",e=>{
  if(!fishing)return;

  hook.x=e.clientX/W*100;

  /*
    Mouse up/down = hook depth control.
  */
  hook.y=e.clientY/H*100;

  hook.x=Math.max(5,Math.min(95,hook.x));
  hook.y=Math.max(5,Math.min(94,hook.y));
});

fishCanvas.addEventListener("touchmove",e=>{
  if(!fishing)return;

  const t=e.touches[0];

  hook.x=t.clientX/W*100;
  hook.y=t.clientY/H*100;

  hook.x=Math.max(5,Math.min(95,hook.x));
  hook.y=Math.max(5,Math.min(94,hook.y));
},{passive:true});

function fishingLoop(){
  if(!fishing)return;

  fishingFrame++;

  /*
    Hook depth is determined by its vertical position.
    The player cannot go deeper than their rod upgrade.
  */
  const wantedDepth=(hook.y/100)*save.depth;

  hook.depth=Math.min(
    save.depth,
    wantedDepth
  );

  document.getElementById("depthNumber").textContent=
    hook.depth.toFixed(1);

  document.getElementById("depthFill").style.height=
    Math.min(100,(hook.depth/save.depth)*100)+"%";

  document.getElementById("caughtCount").textContent=
    caught.length;

  /* move fish */
  for(const item of underwaterFish){

    if(item.caught)continue;

    item.x+=item.speed*item.direction;

    item.phase+=.03;

    item.y+=Math.sin(item.phase)*.025;

    if(item.x>105)item.x=-5;
    if(item.x<-5)item.x=105;
  }

  checkFishCollision();

  drawFishingScene();

  /*
    If the player reaches the maximum depth,
    the hook begins coming back up after a while.
  */
  if(fishingFrame>1200){
    finishFishing();
    return;
  }

  requestAnimationFrame(fishingLoop);
}

function checkFishCollision(){

  for(const item of underwaterFish){

    if(item.caught)continue;

    const dx=item.x-hook.x;
    const dy=item.y-hook.y;

    const distance=Math.hypot(dx,dy);

    if(distance<5){

      if(caught.length>=save.capacity){
        continue;
      }

      /*
        Stronger fish require stronger rods.
        Weak rod = fish can escape.
      */
      if(item.fish.strength>save.strength){

        if(Math.random()<.012){
          showToast(
            `${item.fish.name} was too strong! Upgrade your rod.`
          );

          item.direction*=-1;
        }

        continue;
      }

      item.caught=true;
      caught.push(item.fish);

      showToast(`🎣 Caught ${item.fish.name}!`);

      if(caught.length>=save.capacity){
        setTimeout(finishFishing,500);
      }
    }
  }
}

function drawFishingScene(){

  fctx.clearRect(0,0,W,H);

  /*
    Depth bands make the water feel deeper.
  */
  for(let i=0;i<12;i++){

    const y=H*.08+i*(H*.075);

    fctx.fillStyle=
      `rgba(255,255,255,${.025+i*.002})`;

    fctx.fillRect(0,y,W,H*.075);
  }

  /* bubbles */
  for(let i=0;i<35;i++){

    const x=(i*137+fishingFrame*.25)%W;
    const y=(i*71+fishingFrame*.6)%H;

    fctx.fillStyle="rgba(210,250,255,.22)";

    fctx.beginPath();
    fctx.arc(x,H-y,2+(i%3),0,Math.PI*2);
    fctx.fill();
  }

  /* sea plants */
  for(let i=0;i<14;i++){

    const x=i*(W/13);

    fctx.strokeStyle="rgba(40,150,110,.55)";
    fctx.lineWidth=5;

    fctx.beginPath();
    fctx.moveTo(x,H);
    fctx.quadraticCurveTo(
      x-20,
      H-70,
      x+10,
      H-140
    );
    fctx.stroke();
  }

  /* fish */
  for(const item of underwaterFish){

    if(item.caught)continue;

    const f=item.fish;

    const x=W*item.x/100;
    const y=H*.08+(H*.82)*(item.y/100);

    const size=f.size;

    fctx.save();
    fctx.translate(x,y);

    if(item.direction<0){
      fctx.scale(-1,1);
    }

    /* glow for rare fish */
    if(f.rarity==="Legendary"||f.rarity==="MYTHIC"){

      const glow=fctx.createRadialGradient(
        0,0,2,
        0,0,size*2
      );

      glow.addColorStop(0,"rgba(255,255,255,.55)");
      glow.addColorStop(1,"rgba(255,255,255,0)");

      fctx.fillStyle=glow;

      fctx.beginPath();
      fctx.arc(0,0,size*2,0,Math.PI*2);
      fctx.fill();
    }

    /* body */
    fctx.fillStyle=f.color;

    fctx.beginPath();
    fctx.ellipse(
      0,
      0,
      size,
      size*.5,
      0,
      0,
      Math.PI*2
    );
    fctx.fill();

    /* tail */
    fctx.beginPath();
    fctx.moveTo(-size*.65,0);
    fctx.lineTo(-size*1.2,-size*.6);
    fctx.lineTo(-size*1.2,size*.6);
    fctx.closePath();
    fctx.fill();

    /* eye */
    fctx.fillStyle="#111";

    fctx.beginPath();
    fctx.arc(
      size*.55,
      -size*.12,
      Math.max(2,size*.1),
      0,
      Math.PI*2
    );
    fctx.fill();

    fctx.restore();
  }

  /* hook */
  const hx=W*hook.x/100;
  const hy=H*.08+(H*.82)*(hook.y/100);

  fctx.strokeStyle="#fff";
  fctx.lineWidth=2;

  fctx.beginPath();
  fctx.moveTo(W*.5,0);
  fctx.lineTo(hx,hy);
  fctx.stroke();

  fctx.fillStyle="#ddd";
  fctx.beginPath();
  fctx.arc(hx,hy,6,0,Math.PI*2);
  fctx.fill();

  /* hook ring */
  fctx.strokeStyle="#fff";
  fctx.lineWidth=2;

  fctx.beginPath();
  fctx.arc(hx,hy+9,8,0,Math.PI);
  fctx.stroke();
}

/* =====================================================
   REEL IN
   ===================================================== */

function finishFishing(){

  if(!fishing)return;

  fishing=false;

  document.getElementById("fishing").style.display="none";

  let total=0;

  for(const f of caught){

    save.fish[f.name]=
      (save.fish[f.name]||0)+1;

    total+=f.value;
  }

  /*
    Mutant scroll chance.
  */
  let scrollMessage="";

  const chance=.05+(save.baitLuck/100)*.5;

  if(Math.random()<chance){

    const s=
      scrollTypes[
        Math.floor(Math.random()*scrollTypes.length)
      ];

    save.scrolls[s]=
      (save.scrolls[s]||0)+1;

    scrollMessage=
      `<p class="good">📜 You found a ${s}!</p>`;
  }

  if(caught.length){

    showCatch(
      "🎣 CATCH COMPLETE!",
      `
        <h2>${caught.length} fish caught!</h2>
        <p>You caught:</p>
        <p>${caught.map(f=>f.name).join(", ")}</p>
        <p>Potential value: <b>$${total}</b></p>
        ${scrollMessage}
        <p class="small">
          Visit the Sell Shop to turn your fish into money.
        </p>
      `
    );

  }else{

    showCatch(
      "🌊 Nothing caught",
      `
        <p>You didn't catch any fish.</p>
        <p>Try moving the hook toward fish.</p>
      `
    );
  }

  saveGame();
  hud();
}

/* =====================================================
   CATCH MODAL
   ===================================================== */

function showCatch(title,html){

  document.getElementById("catchTitle").textContent=title;

  document.getElementById("catchContent").innerHTML=html;

  document.getElementById("catchModal").style.display="flex";
}

document.getElementById("closeCatch").onclick=()=>{
  document.getElementById("catchModal").style.display="none";
};

/* =====================================================
   TOAST
   ===================================================== */

let toastTimer;

function showToast(message){

  const t=document.getElementById("toast");

  t.textContent=message;
  t.style.display="block";

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    t.style.display="none";
  },2200);
}

/* =====================================================
   MAIN GAME LOOP
   ===================================================== */

function loop(){

  movePlayer();
  updatePrompt();
  drawWorld();

  requestAnimationFrame(loop);
}

hud();
loop();
