<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fishing Offline</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071521;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* HUD */

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
}

.top{
  position:absolute;
  top:16px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  background:rgba(4,10,18,.72);
  border:1px solid rgba(255,255,255,.15);
  padding:11px 16px;
  border-radius:14px;
  font-weight:900;
  letter-spacing:1px;
  backdrop-filter:blur(8px);
}

.money{
  background:rgba(4,10,18,.72);
  border:1px solid rgba(255,215,70,.25);
  padding:11px 16px;
  border-radius:14px;
  color:#ffd84a;
  font-weight:900;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:24px;
  text-shadow:0 2px 5px #000;
}

#prompt{
  position:absolute;
  left:50%;
  top:56%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  padding:10px 17px;
  border-radius:12px;
  display:none;
  font-weight:bold;
}

#toast{
  position:absolute;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  padding:10px 18px;
  border-radius:12px;
  opacity:0;
  transition:.25s;
}

/* controls */

#help{
  position:absolute;
  right:16px;
  bottom:20px;
  background:rgba(0,0,0,.5);
  padding:10px 13px;
  border-radius:12px;
  font-size:12px;
  line-height:1.6;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.22);
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
}

.buttons{
  position:absolute;
  right:18px;
  bottom:20px;
  display:flex;
  gap:8px;
  pointer-events:auto;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  color:white;
  background:#168cff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

button:active{
  transform:scale(.95);
}

.fishBtn{
  background:#00a878;
}

/* MENU */

#menu,
#catch{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:20;
}

.hidden{
  display:none!important;
}

.panel,
.catchPanel{
  width:min(520px,92%);
  max-height:86vh;
  overflow:auto;
  background:linear-gradient(145deg,#142331,#09131d);
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  padding:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.65);
  color:white;
}

.panel h2{
  margin-bottom:18px;
}

.close{
  float:right;
  background:#333;
  padding:7px 11px;
}

.shopItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  margin:8px 0;
  background:rgba(255,255,255,.055);
  border-radius:12px;
}

.shopItem small{
  display:block;
  opacity:.65;
  margin-top:4px;
}

.catchPanel{
  text-align:center;
}

.catchEmoji{
  font-size:85px;
  margin:10px;
}

.catchPanel h2{
  font-size:30px;
  margin:8px;
}

.common{color:#d5dbe4}
.uncommon{color:#48e58b}
.rare{color:#4ca3ff}
.epic{color:#c467ff}
.legendary{color:#ffd13b}
.mythic{color:#ff4f7a}

@media(max-width:700px){
  #help{display:none}

  .logo{
    font-size:12px;
  }

  .buttons{
    right:12px;
    bottom:20px;
  }

  .buttons button{
    padding:11px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="top">
    <div class="logo">🎣 FISHING OFFLINE</div>
    <div class="money">💰 $<span id="money">500</span></div>
  </div>

  <div id="crosshair">+</div>

  <div id="prompt"></div>

  <div id="toast"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div class="buttons">
    <button class="fishBtn" id="fishButton">🎣 FISH</button>
    <button id="interactButton">E</button>
  </div>

  <div id="help">
    <b>W A S D</b> Move<br>
    <b>Mouse / Swipe</b> Look<br>
    <b>E</b> Interact
  </div>

</div>


<div id="menu" class="hidden">

  <div class="panel">

    <button class="close" onclick="closeMenu()">✕</button>

    <h2 id="menuTitle">SHOP</h2>

    <div id="menuContent"></div>

  </div>

</div>


<div id="catch" class="hidden">

  <div class="catchPanel">

    <div class="catchEmoji" id="catchEmoji">🐟</div>

    <h2 id="catchName">Fish</h2>

    <p id="catchRarity"></p>

    <p id="catchValue"></p>

    <p id="catchMutation"></p>

    <br>

    <button onclick="closeCatch()">KEEP FISH</button>

  </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();


/* =========================================================
   SAVE DATA
========================================================= */

let save=JSON.parse(
  localStorage.getItem("fishingOfflineSave") || "null"
);

if(!save){

  save={
    money:500,
    rod:0,
    bait:0,
    fish:{},
    scrolls:{}
  };

}


/* =========================================================
   FISH
========================================================= */

const fish=[
  {
    name:"Minnow",
    rarity:"Common",
    value:8,
    chance:30,
    emoji:"🐟"
  },
  {
    name:"Bluegill",
    rarity:"Common",
    value:12,
    chance:24,
    emoji:"🐟"
  },
  {
    name:"Bass",
    rarity:"Uncommon",
    value:28,
    chance:16,
    emoji:"🐠"
  },
  {
    name:"Trout",
    rarity:"Uncommon",
    value:40,
    chance:12,
    emoji:"🐟"
  },
  {
    name:"Salmon",
    rarity:"Rare",
    value:80,
    chance:7,
    emoji:"🐟"
  },
  {
    name:"Golden Carp",
    rarity:"Rare",
    value:130,
    chance:4,
    emoji:"🐠"
  },
  {
    name:"Swordfish",
    rarity:"Epic",
    value:280,
    chance:2.5,
    emoji:"🐟"
  },
  {
    name:"Crystal Fish",
    rarity:"Epic",
    value:450,
    chance:1.5,
    emoji:"🐠"
  },
  {
    name:"Ancient Koi",
    rarity:"Legendary",
    value:1000,
    chance:.8,
    emoji:"🐟"
  },
  {
    name:"Sea Dragon",
    rarity:"Mythic",
    value:3000,
    chance:.2,
    emoji:"🐉"
  }
];


/* =========================================================
   RODS
========================================================= */

const rods=[
  {
    name:"Old Rod",
    price:0,
    luck:0
  },
  {
    name:"Wooden Rod",
    price:300,
    luck:8
  },
  {
    name:"Steel Rod",
    price:900,
    luck:20
  },
  {
    name:"Golden Rod",
    price:2500,
    luck:40
  },
  {
    name:"Mythic Rod",
    price:8000,
    luck:75
  }
];


/* =========================================================
   BAIT
========================================================= */

const baits=[
  {
    name:"Worm Bait",
    price:0,
    luck:0
  },
  {
    name:"Shiny Bait",
    price:150,
    luck:12
  },
  {
    name:"Golden Bait",
    price:500,
    luck:30
  },
  {
    name:"Mutant Bait",
    price:1500,
    luck:60
  }
];


/* =========================================================
   SCROLLS
========================================================= */

const scrolls=[
  "Shadow Scroll",
  "Golden Scroll",
  "Crystal Scroll",
  "Void Scroll",
  "Ancient Scroll"
];


/* =========================================================
   PLAYER
========================================================= */

const player={
  x:0,
  y:0,
  angle:0,
  speed:.075
};

let keys={};

addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e"){
    interact();
  }

  if(e.key.toLowerCase()==="f"){
    fishAction();
  }

});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick={
  x:0,
  y:0
};

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyDown=false;

function moveJoystick(e){

  const r=joy.getBoundingClientRect();

  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);

  const max=40;

  const d=Math.hypot(x,y);

  if(d>max){

    x=x/d*max;
    y=y/d*max;

  }

  joystick.x=x/max;
  joystick.y=y/max;

  stick.style.transform=
    `translate(${x}px,${y}px)`;
}

joy.addEventListener("pointerdown",e=>{

  joyDown=true;

  joy.setPointerCapture(e.pointerId);

  moveJoystick(e);

});

joy.addEventListener("pointermove",e=>{

  if(joyDown){
    moveJoystick(e);
  }

});

joy.addEventListener("pointerup",()=>{

  joyDown=false;

  joystick.x=0;
  joystick.y=0;

  stick.style.transform="translate(0,0)";

});


/* =========================================================
   LOOK
========================================================= */

let looking=false;
let lastX=0;

canvas.addEventListener("pointerdown",e=>{

  looking=true;
  lastX=e.clientX;

});

canvas.addEventListener("pointermove",e=>{

  if(!looking)return;

  const dx=e.clientX-lastX;

  lastX=e.clientX;

  player.angle+=dx*.006;

});

addEventListener("pointerup",()=>{
  looking=false;
});


/* =========================================================
   WORLD
========================================================= */

const objects=[

  {
    x:-4,
    y:5,
    type:"sell",
    name:"SELL SHOP",
    color:"#28b85b"
  },

  {
    x:3,
    y:5,
    type:"rod",
    name:"ROD SHOP",
    color:"#d58a27"
  },

  {
    x:8,
    y:3,
    type:"bait",
    name:"BAIT SHOP",
    color:"#a946d1"
  },

  {
    x:-8,
    y:2,
    type:"index",
    name:"FISH INDEX",
    color:"#278eff"
  },

  {
    x:0,
    y:12,
    type:"dock",
    name:"FISHING DOCK",
    color:"#80512c"
  }

];


/* =========================================================
   MOVEMENT
========================================================= */

function update(){

  let forward=0;
  let side=0;

  if(keys.w)forward++;
  if(keys.s)forward--;

  if(keys.a)side--;
  if(keys.d)side++;

  forward+=-joystick.y;
  side+=joystick.x;

  const len=Math.hypot(forward,side);

  if(len>1){

    forward/=len;
    side/=len;

  }

  player.x+=
    (
      Math.sin(player.angle)*forward+
      Math.cos(player.angle)*side
    )*player.speed;

  player.y+=
    (
      Math.cos(player.angle)*forward-
      Math.sin(player.angle)*side
    )*player.speed;

  player.x=Math.max(-15,Math.min(15,player.x));
  player.y=Math.max(-5,Math.min(19,player.y));

}


/* =========================================================
   FIRST PERSON GRAPHICS
========================================================= */

function render(){

  const horizon=H*.47;

  /* SKY */

  const sky=ctx.createLinearGradient(
    0,0,0,horizon
  );

  sky.addColorStop(0,"#4fa9ef");
  sky.addColorStop(.65,"#9bdbff");
  sky.addColorStop(1,"#e5f8ff");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,horizon);


  /* CLOUDS */

  drawCloud(W*.18,H*.16,1.2);
  drawCloud(W*.63,H*.12,.8);
  drawCloud(W*.85,H*.24,1);


  /* SUN */

  ctx.fillStyle="#fff2a3";

  ctx.beginPath();

  ctx.arc(
    W*.8,
    H*.16,
    45,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* WATER */

  const water=ctx.createLinearGradient(
    0,horizon,0,H
  );

  water.addColorStop(0,"#1598c4");
  water.addColorStop(1,"#043e68");

  ctx.fillStyle=water;

  ctx.fillRect(
    0,
    horizon,
    W,
    H-horizon
  );


  /* WATER WAVES */

  ctx.strokeStyle="rgba(255,255,255,.18)";
  ctx.lineWidth=2;

  for(let i=0;i<15;i++){

    const y=horizon+20+i*35;

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y+8);

    ctx.stroke();

  }


  /* ISLAND */

  const iy=horizon+105;

  ctx.fillStyle="#4c9d3e";

  ctx.beginPath();

  ctx.moveTo(0,iy+130);
  ctx.quadraticCurveTo(
    W*.2,
    iy+30,
    W*.5,
    iy+60
  );

  ctx.quadraticCurveTo(
    W*.78,
    iy+20,
    W,
    iy+130
  );

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);

  ctx.closePath();

  ctx.fill();


  /* BEACH */

  ctx.fillStyle="#d8ba75";

  ctx.beginPath();

  ctx.moveTo(0,iy+170);

  ctx.quadraticCurveTo(
    W*.25,
    iy+95,
    W*.5,
    iy+120
  );

  ctx.quadraticCurveTo(
    W*.76,
    iy+85,
    W,
    iy+175
  );

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);

  ctx.closePath();

  ctx.fill();


  /* WORLD OBJECTS */

  objects.forEach(drawObject);


  /* FIRST PERSON ROD */

  drawRod();

}


/* =========================================================
   CLOUD
========================================================= */

function drawCloud(x,y,s){

  ctx.fillStyle="rgba(255,255,255,.75)";

  ctx.beginPath();

  ctx.arc(x,y,30*s,0,Math.PI*2);
  ctx.arc(x+35*s,y-10*s,25*s,0,Math.PI*2);
  ctx.arc(x+65*s,y,32*s,0,Math.PI*2);

  ctx.fill();

}


/* =========================================================
   OBJECT PROJECTION
========================================================= */

function project(obj){

  let dx=obj.x-player.x;
  let dy=obj.y-player.y;

  let angle=
    Math.atan2(dx,dy)-player.angle;

  while(angle>Math.PI)
    angle-=Math.PI*2;

  while(angle<-Math.PI)
    angle+=Math.PI*2;

  return{
    angle,
    depth:Math.hypot(dx,dy)
  };

}


/* =========================================================
   BUILDINGS
========================================================= */

function drawObject(obj){

  const p=project(obj);

  if(p.depth>25)return;

  if(Math.abs(p.angle)>1.2)return;

  const sx=
    W/2+
    Math.tan(p.angle)*W*.72;

  const scale=
    5/Math.max(.5,p.depth);

  const width=130*scale;
  const height=160*scale;

  const base=
    H*.61+
    p.depth*5;


  /* DOCK */

  if(obj.type==="dock"){

    ctx.fillStyle="#744827";

    for(let i=0;i<8;i++){

      ctx.fillRect(
        sx-width/2,
        base+i*11,
        width,
        9
      );

    }

    ctx.fillStyle="#4c2e1b";

    ctx.fillRect(
      sx-width*.55,
      base+80,
      width*.1,
      70
    );

    ctx.fillRect(
      sx+width*.45,
      base+80,
      width*.1,
      70
    );

    drawLabel(
      obj.name,
      sx,
      base-height
    );

    return;

  }


  /* BUILDING */

  ctx.fillStyle=obj.color;

  ctx.fillRect(
    sx-width/2,
    base-height,
    width,
    height
  );


  /* SHADOW SIDE */

  ctx.fillStyle="rgba(0,0,0,.18)";

  ctx.fillRect(
    sx+width*.25,
    base-height,
    width*.25,
    height
  );


  /* ROOF */

  ctx.fillStyle="#422b21";

  ctx.beginPath();

  ctx.moveTo(
    sx-width*.62,
    base-height
  );

  ctx.lineTo(
    sx,
    base-height-width*.4
  );

  ctx.lineTo(
    sx+width*.62,
    base-height
  );

  ctx.closePath();

  ctx.fill();


  /* DOOR */

  ctx.fillStyle="#3b271b";

  ctx.fillRect(
    sx-width*.14,
    base-height*.38,
    width*.28,
    height*.38
  );


  /* WINDOWS */

  ctx.fillStyle="#9fe9ff";

  ctx.fillRect(
    sx-width*.36,
    base-height*.55,
    width*.18,
    height*.15
  );

  ctx.fillRect(
    sx+width*.18,
    base-height*.55,
    width*.18,
    height*.15
  );


  drawLabel(
    obj.name,
    sx,
    base-height-width*.42
  );

}


function drawLabel(text,x,y){

  ctx.textAlign="center";

  ctx.font="bold 18px Arial";

  const width=
    ctx.measureText(text).width+20;

  ctx.fillStyle="rgba(0,0,0,.65)";

  ctx.fillRect(
    x-width/2,
    y-24,
    width,
    28
  );

  ctx.fillStyle="white";

  ctx.fillText(
    text,
    x,
    y-4
  );

}


/* =========================================================
   ROD
========================================================= */

function drawRod(){

  const bob=
    Math.sin(Date.now()*.003)*4;

  ctx.strokeStyle="#352319";
  ctx.lineWidth=10;

  ctx.beginPath();

  ctx.moveTo(W*.73,H+20);
  ctx.lineTo(W*.58,H*.57+bob);

  ctx.stroke();


  ctx.strokeStyle="#d4d4d4";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(W*.58,H*.57+bob);
  ctx.lineTo(W*.53,H*.72);

  ctx.stroke();

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =========================================================
   INTERACTION
========================================================= */

function nearest(){

  let best=null;
  let bestDistance=999;

  objects.forEach(o=>{

    const d=distance(player,o);

    if(d<bestDistance){

      best=o;
      bestDistance=d;

    }

  });

  return bestDistance<4?best:null;

}


function updatePrompt(){

  const obj=nearest();
  const prompt=document.getElementById("prompt");

  if(obj){

    prompt.style.display="block";

    prompt.textContent=
      `E — ${obj.name}`;

  }else{

    prompt.style.display="none";

  }

}


function interact(){

  const obj=nearest();

  if(!obj)return;

  if(obj.type==="dock"){
    fishAction();
  }

  if(obj.type==="sell"){
    openShop("SELL SHOP");
  }

  if(obj.type==="rod"){
    openShop("ROD SHOP");
  }

  if(obj.type==="bait"){
    openShop("BAIT SHOP");
  }

  if(obj.type==="index"){
    openIndex();
  }

}


/* =========================================================
   FISHING
========================================================= */

let fishing=false;

function fishAction(){

  if(fishing)return;

  const dock=
    objects.find(o=>o.type==="dock");

  if(distance(player,dock)>5){

    toast("Walk closer to the fishing dock.");

    return;

  }

  fishing=true;

  toast("🎣 Casting...");

  setTimeout(()=>{

    const luck=
      rods[save.rod].luck+
      baits[save.bait].luck;

    const boosted=fish.map(f=>{

      let multiplier=1;

      if(
        ["Rare","Epic","Legendary","Mythic"]
        .includes(f.rarity)
      ){

        multiplier+=luck/100;

      }

      return{
        ...f,
        chance:f.chance*multiplier
      };

    });


    const total=
      boosted.reduce(
        (a,b)=>a+b.chance,
        0
      );

    let roll=Math.random()*total;

    let caught=boosted[0];

    for(const f of boosted){

      roll-=f.chance;

      if(roll<=0){

        caught=f;

        break;

      }

    }


    let mutation="";


    if(Math.random()<.08+luck/1000){

      const scroll=
        scrolls[
          Math.floor(
            Math.random()*scrolls.length
          )
        ];

      save.scrolls[scroll]=
        (save.scrolls[scroll]||0)+1;

      mutation=
        `📜 ${scroll} discovered!`;

    }


    save.fish[caught.name]=
      (save.fish[caught.name]||0)+1;

    save.money+=caught.value;

    saveGame();

    showCatch(
      caught,
      mutation
    );

    fishing=false;

  },1300);

}


/* =========================================================
   SHOPS
========================================================= */

function openShop(type){

  document.getElementById("menu")
    .classList.remove("hidden");

  document.getElementById("menuTitle")
    .textContent=type;

  const content=
    document.getElementById("menuContent");

  content.innerHTML="";


  if(type==="SELL SHOP"){

    content.innerHTML=`

      <p>
      Your fish are automatically sold when
      you catch them.
      </p>

      <br>

      <p>
      💰 Money:
      <b>$${save.money}</b>
      </p>

    `;

    return;

  }


  if(type==="ROD SHOP"){

    rods.forEach((rod,i)=>{

      const owned=save.rod>=i;

      content.innerHTML+=`

        <div class="shopItem">

          <div>

            <b>${rod.name}</b>

            <small>
              +${rod.luck}% rare fish luck
            </small>

          </div>

          <button
            onclick="buyRod(${i})"
            ${owned?"disabled":""}>

            ${owned?"OWNED":"$"+rod.price}

          </button>

        </div>

      `;

    });

  }


  if(type==="BAIT SHOP"){

    baits.forEach((bait,i)=>{

      const owned=save.bait>=i;

      content.innerHTML+=`

        <div class="shopItem">

          <div>

            <b>${bait.name}</b>

            <small>
              +${bait.luck}% luck
            </small>

          </div>

          <button
            onclick="buyBait(${i})"
            ${owned?"disabled":""}>

            ${owned?"OWNED":"$"+bait.price}

          </button>

        </div>

      `;

    });

  }

}


function buyRod(i){

  if(save.rod>=i)return;

  if(save.money<rods[i].price){

    toast("Not enough money!");

    return;

  }

  save.money-=rods[i].price;

  save.rod=i;

  saveGame();

  updateMoney();

  openShop("ROD SHOP");

}


function buyBait(i){

  if(save.bait>=i)return;

  if(save.money<baits[i].price){

    toast("Not enough money!");

    return;

  }

  save.money-=baits[i].price;

  save.bait=i;

  saveGame();

  updateMoney();

  openShop("BAIT SHOP");

}


/* =========================================================
   FISH INDEX
========================================================= */

function openIndex(){

  document.getElementById("menu")
    .classList.remove("hidden");

  document.getElementById("menuTitle")
    .textContent="🐟 FISH INDEX";

  let html="";

  fish.forEach(f=>{

    const count=
      save.fish[f.name]||0;

    html+=`

      <div class="shopItem">

        <div>

          <b class="${f.rarity.toLowerCase()}">
            ${f.emoji} ${f.name}
          </b>

          <small>
            ${f.rarity} • $${f.value}
          </small>

        </div>

        <strong>${count}</strong>

      </div>

    `;

  });


  html+=`<h3 style="margin-top:20px">
    📜 MUTANT SCROLLS
  </h3>`;


  scrolls.forEach(s=>{

    html+=`

      <div class="shopItem">

        <b>${s}</b>

        <strong>
          ${save.scrolls[s]||0}
        </strong>

      </div>

    `;

  });


  document.getElementById("menuContent")
    .innerHTML=html;

}


function closeMenu(){

  document.getElementById("menu")
    .classList.add("hidden");

}


/* =========================================================
   CATCH SCREEN
========================================================= */

function showCatch(f,mutation){

  document.getElementById("catch")
    .classList.remove("hidden");

  document.getElementById("catchEmoji")
    .textContent=f.emoji;

  document.getElementById("catchName")
    .textContent=f.name;

  const rarity=
    document.getElementById("catchRarity");

  rarity.textContent=f.rarity;

  rarity.className=
    f.rarity.toLowerCase();

  document.getElementById("catchValue")
    .textContent=`+$${f.value}`;

  document.getElementById("catchMutation")
    .textContent=mutation;

  updateMoney();

}


function closeCatch(){

  document.getElementById("catch")
    .classList.add("hidden");

}


/* =========================================================
   UI
========================================================= */

function updateMoney(){

  document.getElementById("money")
    .textContent=save.money;

}


function toast(text){

  const t=
    document.getElementById("toast");

  t.textContent=text;
  t.style.opacity=1;

  clearTimeout(t.timer);

  t.timer=setTimeout(()=>{
    t.style.opacity=0;
  },2200);

}


function saveGame(){

  localStorage.setItem(
    "fishingOfflineSave",
    JSON.stringify(save)
  );

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("interactButton")
  .onclick=interact;

document.getElementById("fishButton")
  .onclick=fishAction;


/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

  update();

  render();

  updatePrompt();

  requestAnimationFrame(loop);

}

updateMoney();

loop();

</script>

</body>
</html>
